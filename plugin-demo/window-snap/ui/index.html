<!doctype html>
<html lang="zh-Hans" data-theme="pure-frost" data-mode="expanded">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file:;">
  <title>Window Snap &amp; Workspaces</title>
  <link rel="stylesheet" href="window-snap.css">
  <script src="window-snap.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <!-- Compact edge-docked pill -->
    <div id="mini-pill" class="mini-pill" data-lucent-drag hidden>
      <button id="expand-pill" class="pill-main" type="button" data-lucent-no-drag>
        <span class="squircle mini" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="4.5" width="7.5" height="15" rx="2" fill="currentColor" stroke="none"/>
            <rect x="13" y="4.5" width="7.5" height="6.5" rx="1.8" fill="currentColor" fill-opacity="0.88" stroke="none"/>
            <rect x="13" y="13" width="7.5" height="6.5" rx="1.8" fill="currentColor" fill-opacity="0.65" stroke="none"/>
          </svg>
        </span>
        <span id="pill-label" class="pill-label"></span>
      </button>
      <button id="pill-close" class="icon-btn compact" type="button" data-label="close" data-lucent-no-drag>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <!-- Full expanded console -->
    <div id="full-view" class="full-view">
      <div class="grip-bar" id="grip-bar" data-lucent-drag>
        <span class="grip-pill" aria-hidden="true"></span>
      </div>

      <header class="topbar" data-lucent-drag>
        <div class="brand">
          <span class="squircle" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3.5" y="4.5" width="7.5" height="15" rx="2" fill="currentColor" stroke="none"/>
              <rect x="13" y="4.5" width="7.5" height="6.5" rx="1.8" fill="currentColor" fill-opacity="0.88" stroke="none"/>
              <rect x="13" y="13" width="7.5" height="6.5" rx="1.8" fill="currentColor" fill-opacity="0.65" stroke="none"/>
            </svg>
          </span>
          <div class="brand-meta">
            <h1 id="app-title" data-text="appTitle"></h1>
            <span id="display-summary" class="brand-sub"></span>
          </div>
        </div>
        <div class="topbar-actions" data-lucent-no-drag>
          <button id="refresh" class="icon-btn" type="button" data-label="refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.4 5.7"/></svg>
          </button>
          <button id="pin-toggle" class="icon-btn" type="button" data-label="pin" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M8 4h8l-1 5 3 3v2H6v-2l3-3-1-5z"/></svg>
          </button>
          <button id="dock-toggle" class="icon-btn" type="button" data-label="dock">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M15 4v16"/></svg>
          </button>
          <button id="close-win" class="icon-btn" type="button" data-label="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <!-- Permission banner (only shown when missing capability or Accessibility TCC) -->
        <div id="permission" class="permission glass-card" hidden>
          <p id="permission-text"></p>
          <div class="permission-actions">
            <button class="primary" id="grant" type="button"></button>
            <button class="subtle" id="open-settings" type="button" hidden data-text="openAccessibility"></button>
          </div>
        </div>

        <!-- Active target window readout + Undo -->
        <section class="target-bar glass-card" id="target-bar">
          <div class="target-info">
            <span class="target-dot" id="target-dot" aria-hidden="true"></span>
            <div class="target-copy">
              <div class="target-app" id="target-app"></div>
              <div class="target-sub" id="target-sub"></div>
            </div>
          </div>
          <button id="undo-snap" class="undo-btn" type="button" data-label="undoTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            <span data-text="undo"></span>
          </button>
        </section>

        <p class="status" id="status" role="status" aria-live="polite" hidden></p>

        <!-- Quick Snap Grid -->
        <section class="snap-section" aria-labelledby="snap-title">
          <header class="section-heading">
            <h2 id="snap-title" data-text="quickSnap"></h2>
            <div class="gap-control" role="group" aria-label="Window gap">
              <span class="gap-caption" data-text="gapLabel"></span>
              <button type="button" class="gap-chip" data-gap="0">0</button>
              <button type="button" class="gap-chip" data-gap="8">8</button>
              <button type="button" class="gap-chip" data-gap="14">14</button>
            </div>
          </header>
          <div id="snap-grid" class="snap-grid"></div>
        </section>

        <!-- Multi-Display Workspaces -->
        <section class="workspace-section" aria-labelledby="workspace-title">
          <header class="section-heading">
            <h2 id="workspace-title" data-text="workspaces"></h2>
            <button id="capture-btn" class="pill-action" type="button" data-text="captureNew"></button>
          </header>
          <div id="workspace-list" class="workspace-list"></div>
          <div id="empty" class="empty glass-card" hidden>
            <p data-text="empty"></p>
            <button id="capture-empty" class="primary" type="button" data-text="captureCurrent"></button>
          </div>
        </section>
      </main>
    </div>

    <div id="modal-scrim" class="modal-scrim" hidden></div>
  </div>

  <!-- Capture / Edit Workspace Modal -->
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="workspace-form">
      <h2 id="editor-title"></h2>
      <label class="field">
        <span data-text="workspaceName"></span>
        <input id="ws-name" required maxlength="60" autocomplete="off">
      </label>
      <div class="quick-names" id="quick-names"></div>

      <div class="slot-head">
        <span data-text="includedWindows"></span>
        <span class="slot-count" id="slot-count"></span>
      </div>
      <div class="slot-list" id="slot-list"></div>

      <label class="toggle-row">
        <input type="checkbox" id="launch-missing">
        <span data-text="launchMissing"></span>
      </label>

      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" class="subtle" id="cancel" data-text="cancel"></button>
        <button type="submit" class="primary" id="save" data-text="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Delete Workspace Confirmation -->
  <dialog id="remove-dialog" aria-labelledby="remove-title">
    <form method="dialog">
      <h2 id="remove-title" data-text="removeTitle"></h2>
      <p id="remove-name"></p>
      <div class="actions">
        <button value="cancel" class="subtle" data-text="cancel" autofocus></button>
        <button value="remove" class="danger" data-text="remove"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
