<!doctype html>
<html lang="zh-Hans" data-theme="pure-frost" data-docked="false" data-expanded="true" data-edge="right">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file:;">
  <title>LocalSend</title>
  <link rel="stylesheet" href="localsend.css">
  <script src="localsend.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <!-- Compact edge-docked widget -->
    <div id="mini-pill" class="mini-pill" data-lucent-drag hidden>
      <button id="expand-pill" class="pill-main" type="button" data-lucent-no-drag>
        <span class="squircle mini" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12.5 20 5l-5.5 15-3-6.2L4 12.5Z"/></svg>
        </span>
        <span class="pill-meta">
          <span class="pill-title-row">
            <span id="pill-dot" class="status-dot live"></span>
            <span class="pill-title">LocalSend</span>
          </span>
          <span id="pill-label" class="pill-label"></span>
        </span>
      </button>
      <button id="pill-close" class="icon-btn compact" type="button" data-label="close" data-lucent-no-drag>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <!-- Full Liquid Glass HUD -->
    <div id="full-view" class="full-view">
      <div class="grip-bar" data-lucent-drag>
        <span class="grip-pill" aria-hidden="true"></span>
      </div>

      <header class="topbar" data-lucent-drag>
        <div class="brand">
          <span class="squircle" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 20 5l-5.5 15-3-6.2L4 12.5Z"/></svg>
          </span>
          <div class="brand-meta">
            <h1 id="device-alias">LocalSend</h1>
            <div class="brand-sub-row">
              <span id="listen-dot" class="status-dot"></span>
              <span id="listen-meta" class="brand-sub"></span>
            </div>
          </div>
        </div>
        <div class="topbar-actions" data-lucent-no-drag>
          <button id="refresh-btn" class="icon-btn" type="button" data-label="refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.4 5.7"/></svg>
          </button>
          <button id="dock-toggle" class="icon-btn" type="button" data-label="dock">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M15 4v16"/></svg>
          </button>
          <button id="close-win" class="icon-btn" type="button" data-label="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <!-- Warning / diagnostic banner -->
        <div id="warning-banner" class="banner warning" hidden>
          <p id="warning-text"></p>
          <button id="open-settings-btn" class="pill-btn small" type="button" data-text="openSettings"></button>
        </div>

        <!-- Incoming transfer confirmation card -->
        <section id="incoming-card" class="glass-card incoming-card" hidden>
          <div class="card-head">
            <span class="badge accent" data-text="incomingBadge"></span>
            <span id="incoming-sender" class="card-title"></span>
          </div>
          <p id="incoming-summary" class="muted-line"></p>
          <div id="incoming-files" class="chip-list"></div>
          <div class="btn-row">
            <button id="incoming-decline" class="pill-btn" type="button" data-text="decline"></button>
            <button id="incoming-accept" class="primary-btn" type="button" data-text="accept"></button>
          </div>
        </section>

        <!-- PIN prompt inline card -->
        <section id="pin-card" class="glass-card pin-card" hidden>
          <p id="pin-prompt-label" class="card-title"></p>
          <div class="inline-form">
            <input id="pin-input" type="password" autocomplete="off">
            <button id="pin-submit" class="primary-btn" type="button" data-text="retrySend"></button>
            <button id="pin-cancel" class="pill-btn" type="button" data-text="cancel"></button>
          </div>
        </section>

        <!-- Send Queue & Drag-Drop Stage -->
        <section class="glass-card stage-card" id="drop-stage">
          <div class="section-row">
            <h2 data-text="queueTitle"></h2>
            <div class="row-actions">
              <button id="paste-clip-btn" class="pill-btn small" type="button" data-text="loadClipboard"></button>
              <button id="clear-queue-btn" class="pill-btn small" type="button" data-text="clearQueue" hidden></button>
            </div>
          </div>

          <div id="queue-chips" class="chip-list" hidden></div>

          <div class="text-compose">
            <textarea id="text-input" rows="2" spellcheck="false"></textarea>
          </div>
          <p id="drop-hint" class="muted-line tiny" data-text="dropHint"></p>
        </section>

        <!-- Nearby Peers -->
        <section class="peers-section">
          <div class="section-row">
            <div class="title-with-count">
              <h2 data-text="peersTitle"></h2>
              <span id="peers-count" class="count-badge">0</span>
            </div>
            <div class="row-actions">
              <button id="deep-scan-btn" class="pill-btn small" type="button" data-text="deepScan"></button>
              <button id="manual-ip-toggle" class="pill-btn small" type="button" data-text="addIP"></button>
            </div>
          </div>

          <div id="manual-ip-box" class="glass-card manual-ip-box" hidden>
            <div class="inline-form">
              <input id="manual-ip-input" type="text" placeholder="192.168.1.88">
              <input id="manual-port-input" type="number" value="53317" min="1024" max="65535" class="port-input">
              <button id="manual-ip-go" class="primary-btn" type="button" data-text="connect"></button>
            </div>
          </div>

          <div id="peers-list" class="peers-list"></div>
          <div id="peers-empty" class="glass-card empty-box">
            <p data-text="peersEmpty"></p>
          </div>
        </section>

        <!-- Active Transfer & Persistent History -->
        <section id="transfer-section" class="transfer-section">
          <div class="section-row">
            <div class="title-with-count">
              <h2 data-text="activityTitle"></h2>
              <span id="history-count" class="count-badge">0</span>
            </div>
            <div class="row-actions">
              <div class="filter-tabs" role="tablist" data-lucent-no-drag>
                <button class="filter-tab active" data-filter="all" type="button" data-text="filterAll"></button>
                <button class="filter-tab" data-filter="receive" type="button" data-text="filterRecv"></button>
                <button class="filter-tab" data-filter="send" type="button" data-text="filterSend"></button>
              </div>
              <button id="clear-history-btn" class="pill-btn small" type="button" data-text="clear" hidden></button>
            </div>
          </div>
          <div id="transfer-list" class="transfer-list"></div>
          <div id="history-empty" class="glass-card empty-box compact">
            <p data-text="historyEmpty"></p>
          </div>
        </section>
      </main>

      <footer class="footer-bar">
        <div class="mode-picker" data-lucent-no-drag>
          <span id="mode-dot" class="mode-dot" aria-hidden="true"></span>
          <select id="receive-mode-select" class="mode-select" data-label="receiveModeLabel">
            <option value="prompt" data-text="modePrompt"></option>
            <option value="quickSave" data-text="modeQuick"></option>
            <option value="sendOnly" data-text="modeSendOnly"></option>
          </select>
          <svg class="mode-chevron" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3.2 4.6 6 2l2.8 2.6M3.2 7.4 6 10l2.8-2.6"/>
          </svg>
        </div>
        <span id="toast-line" class="toast-line" role="status" aria-live="polite"></span>
      </footer>

      <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-pill">
          <span id="drop-overlay-text"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
