<!doctype html>
<html lang="zh-Hans" data-theme="light" data-docked="true" data-expanded="false" data-edge="right">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Pulse</title>
  <style>
    :root,
    html[data-theme="light"] {
      color-scheme: light;
      --spring-ease: cubic-bezier(0.32, 0.72, 0, 1);
      --spring-bounce: cubic-bezier(0.22, 1.08, 0.36, 1);

      --card-bg: linear-gradient(172deg, rgba(255, 255, 255, 0.94) 0%, rgba(248, 249, 252, 0.90) 100%);
      --tile-bg: rgba(255, 255, 255, 0.56);
      --tile-hover: rgba(255, 255, 255, 0.80);
      --tile-rim: rgba(0, 0, 0, 0.075);
      --tile-specular: rgba(255, 255, 255, 0.90);
      --row-bg: rgba(255, 255, 255, 0.64);
      --row-hover: rgba(255, 255, 255, 0.90);
      --sheet-bg: linear-gradient(172deg, #FFFFFF 0%, #F7F8FC 100%);
      --border: rgba(0, 0, 0, 0.09);
      --specular: rgba(255, 255, 255, 0.95);
      --refract-edge: rgba(255, 255, 255, 0.62);
      --shadow: 0 6px 14px -3px rgba(0, 0, 0, 0.11), 0 1.5px 4px rgba(0, 0, 0, 0.05);
      --shadow-docked: 0 4px 10px -2px rgba(0, 0, 0, 0.10), 0 1px 3px rgba(0, 0, 0, 0.045);
      --sheen-color: rgba(255, 255, 255, 0.62);
      --glint-color: rgba(255, 255, 255, 0.94);
      --ripple-color: rgba(0, 113, 227, 0.18);
      --ripple-on-accent: rgba(255, 255, 255, 0.52);

      --label: #1D1D1F;
      --label-secondary: #48484F;
      --label-tertiary: #63636A;
      --toast-bg: rgba(29, 29, 31, 0.95);
      --toast-ink: #F5F5F7;

      --seg-bg: rgba(0, 0, 0, 0.06);
      --seg-active: rgba(255, 255, 255, 0.92);
      --seg-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.96), 0 1px 3px rgba(0, 0, 0, 0.10);

      --btn-bg: rgba(0, 0, 0, 0.055);
      --btn-hover: rgba(0, 0, 0, 0.10);
      --track: rgba(0, 0, 0, 0.09);

      --ios-blue: #0071E3;
      --ios-blue-text: #0066CC;
      --ios-blue-soft: rgba(0, 113, 227, 0.10);
      --ios-blue-rim: rgba(0, 113, 227, 0.36);
      --ios-green: #1E7E34;
      --ios-green-bar: #34C759;
      --ios-green-soft: rgba(52, 199, 89, 0.14);
      --ios-orange: #9A5B00;
      --ios-orange-bar: #FF9500;
      --ios-orange-soft: rgba(255, 149, 0, 0.14);
      --ios-red: #C92A2A;
      --ios-red-bar: #FF3B30;
      --ios-red-soft: rgba(255, 59, 48, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --card-bg: linear-gradient(172deg, rgba(34, 34, 40, 0.92) 0%, rgba(24, 24, 29, 0.89) 100%);
      --tile-bg: rgba(255, 255, 255, 0.06);
      --tile-hover: rgba(255, 255, 255, 0.10);
      --tile-rim: rgba(255, 255, 255, 0.10);
      --tile-specular: rgba(255, 255, 255, 0.13);
      --row-bg: rgba(255, 255, 255, 0.055);
      --row-hover: rgba(255, 255, 255, 0.105);
      --sheet-bg: linear-gradient(172deg, #222228 0%, #19191E 100%);
      --border: rgba(255, 255, 255, 0.12);
      --specular: rgba(255, 255, 255, 0.20);
      --refract-edge: rgba(235, 240, 255, 0.08);
      --shadow: 0 7px 15px -3px rgba(0, 0, 0, 0.44), 0 2px 5px rgba(0, 0, 0, 0.24);
      --shadow-docked: 0 4px 11px -2px rgba(0, 0, 0, 0.40), 0 1px 3px rgba(0, 0, 0, 0.22);
      --sheen-color: rgba(240, 244, 252, 0.13);
      --glint-color: rgba(255, 255, 255, 0.42);
      --ripple-color: rgba(255, 255, 255, 0.22);
      --ripple-on-accent: rgba(255, 255, 255, 0.40);

      --label: #F5F5F7;
      --label-secondary: #AEAEB2;
      --label-tertiary: #98989F;
      --toast-bg: rgba(245, 245, 247, 0.92);
      --toast-ink: #1D1D1F;

      --seg-bg: rgba(255, 255, 255, 0.08);
      --seg-active: rgba(255, 255, 255, 0.18);
      --seg-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 1px 3px rgba(0, 0, 0, 0.28);

      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
      --track: rgba(255, 255, 255, 0.12);

      --ios-blue: #0071E3;
      --ios-blue-text: #409CFF;
      --ios-blue-soft: rgba(64, 156, 255, 0.16);
      --ios-blue-rim: rgba(64, 156, 255, 0.44);
      --ios-green: #30D158;
      --ios-green-bar: #30D158;
      --ios-green-soft: rgba(48, 209, 88, 0.18);
      --ios-orange: #FFD60A;
      --ios-orange-bar: #FFD60A;
      --ios-orange-soft: rgba(255, 214, 10, 0.18);
      --ios-red: #FF6961;
      --ios-red-bar: #FF6961;
      --ios-red-soft: rgba(255, 105, 97, 0.18);
    }

    @media (prefers-contrast: more) {
      :root, html[data-theme="light"] {
        --card-bg: #FFFFFF;
        --tile-bg: #F2F2F7;
        --row-bg: #FFFFFF;
        --border: rgba(0, 0, 0, 0.28);
        --tile-rim: rgba(0, 0, 0, 0.20);
        --label-secondary: #2C2C2E;
        --label-tertiary: #3A3A3C;
      }
      html[data-theme="dark"] {
        --card-bg: #141416;
        --tile-bg: #222226;
        --row-bg: #1C1C20;
        --border: rgba(255, 255, 255, 0.30);
        --tile-rim: rgba(255, 255, 255, 0.22);
        --label-secondary: #D8D8DE;
        --label-tertiary: #C2C2CA;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
      color: var(--label);
      -webkit-font-smoothing: antialiased;
    }

    button:focus-visible {
      outline: 2px solid var(--ios-blue);
      outline-offset: 2px;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px 24px 20px;
      background: transparent;
    }

    html[data-docked="true"][data-edge="right"] .stage {
      justify-content: flex-end;
      padding: 14px 0 22px 20px;
    }
    html[data-docked="true"][data-edge="left"] .stage {
      justify-content: flex-start;
      padding: 14px 20px 22px 0;
    }
    html[data-docked="true"][data-edge="top"] .stage {
      align-items: flex-start;
      padding: 0 20px 22px 20px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px 10px;
      border-radius: 22px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow), inset 0 1px 0 var(--specular), inset 0 0 0 0.5px var(--refract-edge);
      isolation: isolate;
      overflow: hidden;
      --mx: 50%;
      --my: 0%;
      --sheen-op: 0;
      transition:
        border-radius 320ms var(--spring-ease),
        border-color 280ms var(--spring-ease),
        box-shadow 320ms var(--spring-ease),
        color 220ms ease;
    }

    /* Pointer-tracked soft cool-silver/white liquid specular sheen */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(220px circle at var(--mx) var(--my), var(--sheen-color), transparent 68%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, transparent 24%);
      opacity: calc(0.45 + var(--sheen-op) * 0.55);
      transition: opacity 240ms var(--spring-ease);
    }

    .strip-view, .full-view {
      position: relative;
      z-index: 2;
      transition: opacity 240ms var(--spring-ease);
    }

    .card.sheet-open .full-view {
      opacity: 0;
      pointer-events: none;
    }

    .card.alert-ring { border-color: var(--ios-red-bar); }
    .card.done-ring { border-color: var(--ios-green-bar); }

    .card[data-near-edge="left"] {
      box-shadow: var(--shadow), inset 3px 0 0 var(--ios-blue), inset 0 1px 0 var(--specular);
    }
    .card[data-near-edge="right"] {
      box-shadow: var(--shadow), inset -3px 0 0 var(--ios-blue), inset 0 1px 0 var(--specular);
    }
    .card[data-near-edge="top"] {
      box-shadow: var(--shadow), inset 0 3px 0 var(--ios-blue);
    }

    /* Flush Edge Styling when Docked (both collapsed strip & hover-expanded full card) */
    html[data-docked="true"][data-edge="right"] .card {
      border-radius: 20px 0 0 20px;
      border-right: none;
    }
    html[data-docked="true"][data-edge="left"] .card {
      border-radius: 0 20px 20px 0;
      border-left: none;
    }
    html[data-docked="true"][data-edge="top"] .card {
      border-radius: 0 0 20px 20px;
      border-top: none;
    }

    /* Collapsed Edge Strip Padding & Cursor */
    html[data-docked="true"][data-expanded="false"] .card {
      padding: 7px 10px;
      border-radius: 18px 0 0 18px;
      box-shadow: var(--shadow-docked), inset 0 1px 0 var(--specular), inset 0 0 0 0.5px var(--refract-edge);
      cursor: pointer;
    }
    html[data-docked="true"][data-expanded="false"][data-edge="left"] .card {
      border-radius: 0 18px 18px 0;
    }
    html[data-docked="true"][data-expanded="false"][data-edge="top"] .card {
      padding: 4px 11px;
      border-radius: 0 0 16px 16px;
    }

    /* Colored Status Spine Along Docked Edge */
    .card::after {
      content: "";
      position: absolute;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity 220ms var(--spring-ease), background 220ms ease;
      background: var(--ios-blue);
    }
    .card[data-health="running"]::after { background: var(--ios-blue); }
    .card[data-health="good"]::after { background: var(--ios-green-bar); }
    .card[data-health="warn"]::after { background: var(--ios-orange-bar); }
    .card[data-health="crit"]::after { background: var(--ios-red-bar); }

    html[data-docked="true"][data-edge="right"] .card::after {
      top: 0; right: 0; width: 3px; height: 100%; opacity: 0.94;
    }
    html[data-docked="true"][data-edge="left"] .card::after {
      top: 0; left: 0; width: 3px; height: 100%; opacity: 0.94;
    }
    html[data-docked="true"][data-edge="top"] .card::after {
      top: 0; left: 0; right: 0; width: 100%; height: 2.5px; opacity: 0.94;
    }

    /* View Visibility: Strictly 2 Clean Views (Collapsed Strip vs Full Large HUD) */
    .strip-view, .full-view { display: none; }
    html[data-docked="true"][data-expanded="false"] .strip-view {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      gap: 2px;
      animation: lg-view-enter 300ms var(--spring-ease);
    }
    html[data-docked="true"][data-expanded="false"][data-edge="top"] .strip-view {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    html[data-expanded="true"] .full-view,
    html[data-docked="false"] .full-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 5.5px;
      animation: lg-view-enter 320ms var(--spring-ease);
    }

    /* Edge-Cycle Button Only Relevant When Docked */
    html[data-docked="false"] #edgeCycleBtn { display: none; }

    @keyframes pulseDot {
      0%, 100% { box-shadow: 0 0 0 2px var(--ios-blue-soft); opacity: 1; }
      50% { box-shadow: 0 0 0 5px rgba(0, 113, 227, 0.08); opacity: 0.72; }
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ios-green-bar);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--ios-green-soft);
      transition: background 200ms ease, box-shadow 200ms ease;
    }
    .live-dot.running {
      background: var(--ios-blue);
      box-shadow: 0 0 0 2px var(--ios-blue-soft);
      animation: pulseDot 1.6s ease-in-out infinite;
    }
    .live-dot.loading { background: var(--ios-blue); box-shadow: 0 0 0 2px var(--ios-blue-soft); }
    .live-dot.warn { background: var(--ios-orange-bar); box-shadow: 0 0 0 2px var(--ios-orange-soft); }
    .live-dot.error { background: var(--ios-red-bar); box-shadow: 0 0 0 2px var(--ios-red-soft); }
    .live-dot.idle { background: var(--label-tertiary); box-shadow: none; }

    /* Collapsed Edge Strip Content */
    .strip-top {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .strip-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--label);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }
    .strip-pager {
      font-size: 9px;
      font-weight: 600;
      color: var(--label-tertiary);
      flex-shrink: 0;
    }
    .strip-pager:empty { display: none; }
    .strip-mid {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
    }
    .strip-ctx {
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.08;
    }
    .strip-pct {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--label-secondary);
    }
    .strip-status {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--ios-green);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .strip-status.running { color: var(--ios-blue-text); }
    .strip-status.warn { color: var(--ios-orange); }
    .strip-status.crit { color: var(--ios-red); }

        html[data-docked="true"][data-expanded="false"][data-edge="top"] .strip-top {
      max-width: 88px;
    }
    html[data-docked="true"][data-expanded="false"][data-edge="top"] .strip-ctx {
      font-size: 13px;
    }
    html[data-docked="true"][data-expanded="false"][data-edge="top"] .strip-pct {
      display: none;
    }
    html[data-docked="true"][data-expanded="false"][data-edge="top"] .strip-status {
      font-size: 9px;
    }

    /* Interactive surfaces with ripple & gleam */
    .icon-btn,
    .session-pill,
    .all-link-btn,
    .open-sess-btn,
    .sheet-jump-btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    /* Full Large HUD Header & Controls */
    .icon-btn {
      width: 23px;
      height: 23px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--label-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 180ms var(--spring-ease), color 160ms ease, transform 220ms var(--spring-bounce), box-shadow 180ms ease;
    }
    .icon-btn:hover { background: var(--btn-bg); color: var(--label); }
    .icon-btn.active { background: var(--ios-blue-soft); color: var(--ios-blue-text); box-shadow: inset 0 0 0 1px var(--ios-blue-rim); }
    .icon-btn.close-btn:hover { background: var(--ios-red-soft); color: var(--ios-red); }
    .icon-btn svg { width: 12.5px; height: 12.5px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .status-toast {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translate(-50%, 8px) scale(0.96);
      padding: 4.5px 11px;
      border-radius: 999px;
      background: var(--toast-bg);
      color: var(--toast-ink);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms var(--spring-ease), transform 260ms var(--spring-bounce);
      z-index: 25;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
    }
    .status-toast.visible { opacity: 1; transform: translate(-50%, 0) scale(1); }

    .std-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 24px;
      cursor: grab;
    }
    .std-header:active { cursor: grabbing; }

    .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 0;
      height: 25px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--tile-rim);
      background: var(--tile-bg);
      box-shadow: inset 0 1px 0 var(--tile-specular);
      color: var(--label);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms var(--spring-ease), border-color 180ms ease, box-shadow 200ms ease, transform 220ms var(--spring-bounce);
    }
    .session-pill:hover { background: var(--tile-hover); border-color: var(--ios-blue-rim); }
    .session-pill.switch-flash,
    .strip-view.switch-flash {
      box-shadow: 0 0 0 1.5px var(--ios-blue);
    }
    .session-pill-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    .proj-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--ios-blue-soft);
      color: var(--ios-blue-text);
      flex-shrink: 0;
      max-width: 74px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .proj-badge:empty { display: none; }

    .pager-badge {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--label-tertiary);
      flex-shrink: 0;
      margin-left: auto;
      padding-left: 2px;
    }
    .pager-badge:empty { display: none; }

    .session-state-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 999px;
      background: var(--ios-green-soft);
      color: var(--ios-green);
      flex-shrink: 0;
    }
    .session-state-tag.running { background: var(--ios-blue-soft); color: var(--ios-blue-text); }
    .session-state-tag.error { background: var(--ios-red-soft); color: var(--ios-red); }
    .session-state-tag.idle { background: var(--btn-bg); color: var(--label-secondary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.5px;
      flex-shrink: 0;
    }

    .ios-tile {
      background: var(--tile-bg);
      border: 1px solid var(--tile-rim);
      box-shadow: inset 0 1px 0 var(--tile-specular);
      border-radius: 15px;
      padding: 8px 10px;
      transition: background 200ms var(--spring-ease), border-color 200ms ease;
    }

    .ctx-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }
    .ctx-title-group { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
    .ctx-big { font-size: 19px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
    .ctx-limit { font-size: 10.5px; font-weight: 500; color: var(--label-secondary); }
    .ctx-meta-right { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; min-width: 0; }
    .ctx-model-chip {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--label-secondary);
      max-width: 82px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ctx-model-chip:empty { display: none; }

    .status-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7.5px;
      border-radius: 999px;
      background: var(--ios-blue-soft);
      color: var(--ios-blue-text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-pill.good { background: var(--ios-green-soft); color: var(--ios-green); }
    .status-pill.warn { background: var(--ios-orange-soft); color: var(--ios-orange); }
    .status-pill.crit { background: var(--ios-red-soft); color: var(--ios-red); }

    .storage-bar {
      width: 100%;
      height: 6.5px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      display: flex;
      gap: 1.5px;
    }
    .bar-seg-cache {
      height: 100%;
      background: var(--ios-green-bar);
      border-radius: 999px 0 0 999px;
      transition: width 320ms var(--spring-ease);
    }
    .bar-seg-input {
      height: 100%;
      background: var(--ios-blue);
      border-radius: 0 999px 999px 0;
      transition: width 320ms var(--spring-ease);
    }
    .bar-seg-input.warn { background: var(--ios-orange-bar); }
    .bar-seg-input.crit { background: var(--ios-red-bar); }

    .ctx-legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 5px;
      font-size: 10px;
      color: var(--label-secondary);
    }
    .legend-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot-label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .swatch { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .swatch.cache { background: var(--ios-green-bar); }
    .swatch.input { background: var(--ios-blue); }

    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .stat-tile {
      background: var(--tile-bg);
      border: 1px solid var(--tile-rim);
      box-shadow: inset 0 1px 0 var(--tile-specular);
      border-radius: 15px;
      padding: 7px 9px 7.5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 64px;
      min-width: 0;
      transition: background 200ms var(--spring-ease), border-color 200ms ease;
    }
    .stat-tile.warn-tile { border-color: var(--ios-red-bar); box-shadow: inset 0 0 0 1px var(--ios-red-soft); }
    .stat-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .stat-label { font-size: 10.5px; font-weight: 600; color: var(--label-secondary); white-space: nowrap; }

    /* Sliding Liquid Droplet Segmented Control */
    .ios-seg {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 999px;
      background: var(--seg-bg);
      gap: 1px;
      isolation: isolate;
    }
    .seg-thumb {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 0;
      width: 0;
      border-radius: 999px;
      background: var(--seg-active);
      box-shadow: var(--seg-shadow);
      pointer-events: none;
      z-index: 0;
      transform: translateX(0) scaleX(1) scaleY(1);
      transform-origin: center;
      transition:
        transform 280ms var(--spring-bounce),
        width 260ms var(--spring-ease),
        opacity 150ms ease;
      opacity: 0;
    }
    .seg-thumb.ready { opacity: 1; }
    .seg-thumb.no-anim { transition: none !important; }
    .ios-seg button {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      color: var(--label-secondary);
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.15;
      transition: color 180ms ease;
    }
    .ios-seg button:hover { color: var(--label); }
    .ios-seg button.active { color: var(--label); }

    .stat-value-row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; margin-top: 2px; }
    .stat-value { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .stat-value.good { color: var(--ios-green); }
    .stat-value.warn { color: var(--ios-orange); }
    .stat-value.crit { color: var(--ios-red); }
    .stat-speed {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--ios-blue-text);
      background: var(--ios-blue-soft);
      padding: 1.5px 6px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .stat-speed:empty { display: none; }
    .stat-sub { font-size: 10px; color: var(--label-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1.5px; }

    /* Bottom Docked Panel: Inline Recent Sessions OR Context Sparkline */
    .bottom-panel {
      position: relative;
      flex: 1;
      min-height: 98px;
      background: var(--tile-bg);
      border: 1px solid var(--tile-rim);
      box-shadow: inset 0 1px 0 var(--tile-specular);
      border-radius: 15px;
      padding: 7px 9px 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .panel-title-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .panel-title { font-size: 10.5px; font-weight: 700; color: var(--label); white-space: nowrap; }
    .panel-sub { font-size: 9.5px; color: var(--label-secondary); white-space: nowrap; }
    .panel-controls { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .all-link-btn {
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--ios-blue-text);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      cursor: pointer;
      transition: background 180ms ease, color 160ms ease, transform 220ms var(--spring-bounce);
    }
    .all-link-btn:hover { background: var(--ios-blue-soft); }

    .inline-sessions {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
      overflow: hidden;
    }
    .inline-sess-row,
    .sheet-row {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transform-style: preserve-3d;
      transition:
        background 180ms var(--spring-ease),
        border-color 180ms ease,
        box-shadow 200ms var(--spring-ease),
        transform 240ms var(--spring-bounce);
    }
    .inline-sess-row::after,
    .sheet-row::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.2px;
      background: linear-gradient(115deg, transparent 22%, var(--glint-color) 48%, transparent 74%);
      background-size: 240% 240%;
      background-position: 140% 0%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }
    .inline-sess-row.is-glinting::after,
    .sheet-row.is-glinting::after {
      animation: lg-rim-glint 540ms var(--spring-ease) forwards;
    }
    .inline-sess-row.is-pressing,
    .sheet-row.is-pressing {
      transform: perspective(400px) rotateX(var(--press-rx, 0deg)) rotateY(var(--press-ry, 0deg)) scale(0.988);
    }

    .inline-sess-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 3px 7px;
      border-radius: 10px;
      background: var(--row-bg);
      border: 1px solid var(--tile-rim);
      cursor: pointer;
      min-height: 23px;
    }
    .inline-sess-row:hover { background: var(--row-hover); border-color: var(--ios-blue-rim); }
    .inline-sess-row.active-row {
      background: var(--ios-blue-soft);
      border-color: var(--ios-blue-rim);
    }
    .inline-sess-left { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; }
    .inline-sess-title { font-size: 10.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inline-sess-right { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .open-sess-btn {
      border: none;
      border-radius: 999px;
      padding: 2px 7.5px;
      font-size: 9.5px;
      font-weight: 600;
      background: var(--ios-blue-soft);
      color: var(--ios-blue-text);
      cursor: pointer;
      transition: background 180ms var(--spring-ease), color 160ms ease, transform 220ms var(--spring-bounce);
    }
    .open-sess-btn:hover { background: var(--ios-blue); color: #FFFFFF; }

    .spark-canvas-box { position: relative; width: 100%; flex: 1; min-height: 62px; display: none; }
    .bottom-panel[data-tab="chart"] .inline-sessions { display: none; }
    .bottom-panel[data-tab="chart"] .spark-canvas-box { display: block; }
    #sparkCanvas { width: 100%; height: 100%; display: block; }
    .hover-tip {
      position: absolute;
      top: 2px;
      left: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--sheet-bg);
      border: 1px solid var(--border);
      color: var(--label);
      font-size: 9.5px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }
    .hover-tip.visible { opacity: 1; }

    .alert-banner {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      padding: 6.5px 11px;
      border-radius: 13px;
      background: var(--ios-red-bar);
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(255, 59, 48, 0.30);
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      pointer-events: none;
      transition: opacity 220ms var(--spring-ease), transform 260ms var(--spring-bounce);
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
    }
    .alert-banner.done-banner {
      background: var(--ios-green-bar);
      box-shadow: 0 8px 20px rgba(52, 199, 89, 0.32);
    }
    .alert-banner.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .alert-banner-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .alert-banner-cta {
      flex-shrink: 0;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      font-size: 9.5px;
    }

    /* Full Recent Sessions Sheet */
    .session-sheet {
      position: absolute;
      inset: 0;
      background: var(--sheet-bg);
      border-radius: inherit;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.985);
      transition: opacity 260ms var(--spring-ease), transform 340ms var(--spring-ease);
      z-index: 20;
    }
    .session-sheet.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-shrink: 0; cursor: grab; }
    .sheet-head:active { cursor: grabbing; }
    .sheet-title-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .sheet-title { font-size: 12px; font-weight: 700; }
    .sheet-summary { font-size: 10px; color: var(--label-secondary); font-weight: 600; }
    .sheet-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 2px; }
    .sheet-row {
      border-radius: 12px;
      padding: 6.5px 9px;
      background: var(--tile-bg);
      border: 1px solid var(--tile-rim);
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
    }
    .sheet-row:hover { background: var(--tile-hover); border-color: var(--ios-blue-rim); }
    .sheet-row.selected {
      background: var(--ios-blue-soft);
      border-color: var(--ios-blue-rim);
    }
    .sheet-row-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; font-weight: 600; }
    .sheet-row-title-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; }
    .sheet-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-row-actions { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .sheet-jump-btn {
      border: none;
      border-radius: 999px;
      padding: 2.5px 8px;
      font-size: 9.5px;
      font-weight: 600;
      background: var(--ios-blue);
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: filter 160ms ease, transform 220ms var(--spring-bounce);
    }
    .sheet-jump-btn:hover { filter: brightness(1.08); }
    .sheet-row-sub { font-size: 9.5px; color: var(--label-secondary); display: flex; justify-content: space-between; gap: 6px; }

    /* Optical Liquid Ripple, Specular Gleam & Spring Bounce */
    .lg-ripple {
      position: absolute;
      left: var(--rx, 50%);
      top: var(--ry, 50%);
      width: var(--rs, 60px);
      height: var(--rs, 60px);
      margin-left: calc(var(--rs, 60px) * -0.5);
      margin-top: calc(var(--rs, 60px) * -0.5);
      border-radius: 999px;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(circle, var(--ripple-color) 0%, transparent 72%);
      transform: scale(0.08);
      opacity: 0.9;
      animation: lg-ripple-expand 460ms var(--spring-ease) forwards;
    }
    .sheet-jump-btn .lg-ripple {
      background: radial-gradient(circle, var(--ripple-on-accent) 0%, transparent 72%);
    }
    .lg-gleam {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(108deg, transparent 24%, rgba(255, 255, 255, 0.42) 48%, transparent 72%);
      transform: translateX(-120%);
      animation: lg-gleam-sweep 400ms var(--spring-ease) forwards;
    }
    .is-bouncing { animation: lg-btn-bounce 240ms var(--spring-bounce); }
    .is-success { animation: lg-success-pulse 640ms var(--spring-ease); }

    @keyframes lg-ripple-expand {
      0% { transform: scale(0.15); opacity: 0.28; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes lg-gleam-sweep {
      0% { transform: translateX(-120%); opacity: 0.30; }
      100% { transform: translateX(130%); opacity: 0; }
    }
    @keyframes lg-btn-bounce {
      0% { transform: scale(1); }
      32% { transform: scale(0.976); }
      72% { transform: scale(1.004); }
      100% { transform: scale(1); }
    }
    @keyframes lg-rim-glint {
      0% { opacity: 0.30; background-position: 140% 0%; }
      65% { opacity: 0.22; background-position: -30% 100%; }
      100% { opacity: 0; background-position: -70% 100%; }
    }
    @keyframes lg-success-pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.48); }
      45% { box-shadow: 0 0 0 5px rgba(52, 199, 89, 0.14); }
      100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
    }
    @keyframes lg-view-enter {
      0% { opacity: 0; transform: scale(0.985); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        transform: none !important;
      }
      .lg-ripple, .lg-gleam { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="stage" class="stage">
    <div id="card" class="card" data-health="good">

      <!-- COLLAPSED EDGE-DOCKED STRIP (136x74 side / 228x44 top; Hover -> Expands to Full Large HUD) -->
      <div id="stripView" class="strip-view" title="悬停展开大悬浮窗 · 滚轮切换活跃项目">
        <div class="strip-top">
          <span id="stripDot" class="live-dot"></span>
          <span id="stripTitle" class="strip-title">Antigravity</span>
          <span id="stripPager" class="strip-pager tabular"></span>
        </div>
        <div class="strip-mid">
          <span id="stripCtx" class="strip-ctx tabular">--</span>
          <span id="stripPct" class="strip-pct tabular">--%</span>
        </div>
        <span id="stripStatus" class="strip-status tabular">--</span>
      </div>

      <!-- FULL LARGE iOS WIDGET VIEW (352 x 334, Used Both When Hover-Expanded & Free-Floating) -->
      <div class="full-view">
        <div id="dragHeader" class="std-header">
          <button id="sessionPillBtn" class="session-pill" type="button" title="鼠标滚轮切换相邻活跃项目 · 点击查看全部">
            <span id="liveDot" class="live-dot"></span>
            <span id="stdProjBadge" class="proj-badge"></span>
            <span id="stdTitle" class="session-pill-text">Antigravity</span>
            <span id="stdPager" class="pager-badge tabular"></span>
          </button>
          <div class="header-actions">
            <button id="returnAgyBtn" class="icon-btn" type="button" aria-label="直达对应对话" title="直达当前 Antigravity 对话">
              <svg viewBox="0 0 16 16"><path d="M6 3.5h6.5V10M12.5 3.5L5 11"/><path d="M10.5 12.5h-6a1 1 0 0 1-1-1v-6"/></svg>
            </button>
            <button id="dockModeBtn" class="icon-btn" type="button" aria-label="切换常驻大窗或缩边" title="切换常驻大窗 / 缩边自动收缩">
              <svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M10.2 3v10"/></svg>
            </button>
            <button id="edgeCycleBtn" class="icon-btn" type="button" aria-label="切换停靠边缘" title="切换停靠边缘（右 / 左 / 顶）">
              <svg viewBox="0 0 16 16"><path d="M3 5.5h10M10.5 3L13 5.5 10.5 8M13 10.5H3M5.5 8L3 10.5 5.5 13"/></svg>
            </button>
            <button id="opacityBtn" class="icon-btn" type="button" aria-label="切换透明度" title="切换透明度">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="closeBtn" class="icon-btn close-btn" type="button" aria-label="关闭悬浮窗" title="关闭悬浮窗">
              <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
            </button>
          </div>
        </div>

        <!-- Hero Context Usage Tile -->
        <div class="ios-tile">
          <div class="ctx-top">
            <div class="ctx-title-group">
              <span id="ctxBig" class="ctx-big tabular">--</span>
              <span id="ctxLimit" class="ctx-limit tabular">/ --</span>
            </div>
            <div class="ctx-meta-right">
              <span id="modelLabel" class="ctx-model-chip"></span>
              <span id="stateTag" class="session-state-tag">--</span>
              <span id="ctxPctPill" class="status-pill tabular">--%</span>
            </div>
          </div>
          <div class="storage-bar" role="progressbar" aria-label="上下文占用">
            <div id="segCache" class="bar-seg-cache" style="width: 0%"></div>
            <div id="segInput" class="bar-seg-input" style="width: 0%"></div>
          </div>
          <div class="ctx-legend">
            <div class="legend-left">
              <span class="dot-label"><span class="swatch cache"></span><span id="legendCache" class="tabular">缓存 --</span></span>
              <span class="dot-label"><span class="swatch input"></span><span id="legendInput" class="tabular">新输入 --</span></span>
            </div>
            <span id="legendOutput" class="tabular">输出 --</span>
          </div>
        </div>

        <!-- Two-Column Bento Stats -->
        <div class="bento-grid">
          <div id="cacheTile" class="stat-tile">
            <div class="stat-head">
              <span class="stat-label">缓存命中</span>
              <div class="ios-seg" role="tablist" aria-label="缓存口径">
                <button class="cache-tab active" data-scope="cum" type="button">累计</button>
                <button class="cache-tab" data-scope="last" type="button">本轮</button>
              </div>
            </div>
            <div class="stat-value-row">
              <span id="cacheRateVal" class="stat-value good tabular">--</span>
            </div>
            <div id="cacheSubVal" class="stat-sub tabular">等待会话数据</div>
          </div>

          <div class="stat-tile">
            <div class="stat-head">
              <span class="stat-label">净用量</span>
              <div class="ios-seg" role="tablist" aria-label="统计周期">
                <button class="win-tab active" data-win="5h" type="button">5h</button>
                <button class="win-tab" data-win="today" type="button">今</button>
                <button class="win-tab" data-win="7d" type="button">7d</button>
              </div>
            </div>
            <div class="stat-value-row">
              <span id="winTotalVal" class="stat-value tabular">--</span>
              <span id="winSpeedVal" class="stat-speed tabular" title="所选周期平均输出速度"></span>
            </div>
            <div id="winSubVal" class="stat-sub tabular">含缓存 -- · -- 轮</div>
          </div>
        </div>

        <!-- Inline Recent Sessions + Sparkline Toggle -->
        <div id="bottomPanel" class="bottom-panel" data-tab="sessions">
          <div class="panel-head">
            <div class="panel-title-wrap">
              <span class="panel-title">最近会话</span>
              <span id="recentCountMeta" class="panel-sub tabular">--</span>
            </div>
            <div class="panel-controls">
              <div class="ios-seg" role="tablist" aria-label="底部视图">
                <button class="panel-tab active" data-panel="sessions" type="button">会话</button>
                <button class="panel-tab" data-panel="chart" type="button">趋势</button>
              </div>
              <button id="allSessionsBtn" class="all-link-btn" type="button" title="展开全部最近会话">全部›</button>
            </div>
          </div>
          <div id="inlineSessionsList" class="inline-sessions"></div>
          <div id="sparkBox" class="spark-canvas-box">
            <canvas id="sparkCanvas"></canvas>
            <div id="hoverTip" class="hover-tip tabular"></div>
          </div>
        </div>
      </div>

      <!-- Alert / Session Completed Banner -->
      <div id="alertBanner" class="alert-banner">
        <span id="alertBannerText" class="alert-banner-text"></span>
        <span id="alertBannerCta" class="alert-banner-cta">直达 ↗</span>
      </div>
      <div id="statusToast" class="status-toast"></div>

      <!-- Full Recent Sessions Sheet -->
      <div id="sessionSheet" class="session-sheet" aria-hidden="true">
        <div class="sheet-head">
          <div class="sheet-title-wrap">
            <span class="sheet-title">全部最近会话</span>
            <span id="sheetSummary" class="sheet-summary tabular"></span>
          </div>
          <button id="closeSheetBtn" class="icon-btn close-btn" type="button" aria-label="关闭会话列表">
            <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
          </button>
        </div>
        <div id="sheetList" class="sheet-list"></div>
      </div>

    </div>
  </div>

  <script>
    (() => {
      const FULL_SIZE = { w: 376, h: 356 };
      const STRIP_SIZES = {
        right: { w: 164, h: 104 },
        left: { w: 164, h: 104 },
        top: { w: 260, h: 60 }
      };
      const EDGE_ORDER = ["right", "left", "top"];

      const state = {
        docked: true,
        expanded: false,
        edge: "right",
        themeStyle: "auto",
        refreshSec: 3,
        cacheScope: "cum",
        winScope: "5h",
        bottomTab: "sessions",
        pinnedSessionId: "",
        snapshot: null,
        hoverIndex: null,
        opacityIdx: 0,
        opacityLevels: [1.0, 0.88, 0.74],
        mouseInside: false,
        dragging: false,
        morphing: false,
        closing: false,
        fetching: false,
        pendingRefetch: false,
        ignoreAutoUntil: 0,
        ignoreHoverUntil: 0,
        expandTimer: null,
        retractTimer: null,
        wheelAccum: 0,
        wheelLastEventAt: 0,
        wheelLastSwitchAt: 0,
        wheelFetchTimer: null,
        flashTimer: null,
        lastConfigMode: null,
        lastAlertKey: "",
        bannerPayload: null,
        bannerTimer: null,
        timer: null,
        runChain: Promise.resolve()
      };

      const $ = (id) => document.getElementById(id);
      const el = {
        stage: $("stage"),
        card: $("card"),
        stripView: $("stripView"),
        stripDot: $("stripDot"),
        stripTitle: $("stripTitle"),
        stripPager: $("stripPager"),
        stripCtx: $("stripCtx"),
        stripPct: $("stripPct"),
        stripStatus: $("stripStatus"),
        liveDot: $("liveDot"),
        stdProjBadge: $("stdProjBadge"),
        stdTitle: $("stdTitle"),
        stdPager: $("stdPager"),
        modelLabel: $("modelLabel"),
        stateTag: $("stateTag"),
        sessionPillBtn: $("sessionPillBtn"),
        returnAgyBtn: $("returnAgyBtn"),
        dockModeBtn: $("dockModeBtn"),
        edgeCycleBtn: $("edgeCycleBtn"),
        opacityBtn: $("opacityBtn"),
        closeBtn: $("closeBtn"),
        ctxBig: $("ctxBig"),
        ctxLimit: $("ctxLimit"),
        ctxPctPill: $("ctxPctPill"),
        segCache: $("segCache"),
        segInput: $("segInput"),
        legendCache: $("legendCache"),
        legendInput: $("legendInput"),
        legendOutput: $("legendOutput"),
        cacheTile: $("cacheTile"),
        cacheRateVal: $("cacheRateVal"),
        cacheSubVal: $("cacheSubVal"),
        winTotalVal: $("winTotalVal"),
        winSpeedVal: $("winSpeedVal"),
        winSubVal: $("winSubVal"),
        bottomPanel: $("bottomPanel"),
        recentCountMeta: $("recentCountMeta"),
        inlineSessionsList: $("inlineSessionsList"),
        allSessionsBtn: $("allSessionsBtn"),
        sparkBox: $("sparkBox"),
        sparkCanvas: $("sparkCanvas"),
        hoverTip: $("hoverTip"),
        alertBanner: $("alertBanner"),
        alertBannerText: $("alertBannerText"),
        alertBannerCta: $("alertBannerCta"),
        statusToast: $("statusToast"),
        sessionSheet: $("sessionSheet"),
        sheetSummary: $("sheetSummary"),
        sheetList: $("sheetList"),
        closeSheetBtn: $("closeSheetBtn")
      };
      let statusToastTimer = null;

      const hasNativeMotion = Boolean(
        window.lucent?.window?.snapToEdge &&
        window.lucent?.window?.morph &&
        window.lucent?.window?.onDragEnd
      );

      const darkMedia = window.matchMedia?.("(prefers-color-scheme: dark)") || null;
      const reducedMotionMedia = window.matchMedia?.("(prefers-reduced-motion: reduce)") || null;

      function syncDOMState() {
        document.documentElement.setAttribute("data-docked", state.docked ? "true" : "false");
        document.documentElement.setAttribute("data-expanded", (state.expanded || !state.docked) ? "true" : "false");
        document.documentElement.setAttribute("data-edge", state.edge);
        el.dockModeBtn.classList.toggle("active", !state.docked);
        el.dockModeBtn.title = state.docked
          ? "当前：贴边悬停展开（点击改为常驻大窗）"
          : "当前：常驻大窗（点击缩回屏幕边缘）";
        if (state.expanded || !state.docked) {
          requestAnimationFrame(() => syncAllSegThumbs(false));
        }
      }

      function stripSizeForEdge(edge) {
        return STRIP_SIZES[edge] || STRIP_SIZES.right;
      }

      function anchorForEdge(edge) {
        if (edge === "left") return "leftCenter";
        if (edge === "top") return "topCenter";
        return "rightCenter";
      }

      function clearHoverTimers() {
        if (state.expandTimer) { clearTimeout(state.expandTimer); state.expandTimer = null; }
        if (state.retractTimer) { clearTimeout(state.retractTimer); state.retractTimer = null; }
      }

      function showStatusToast(msg) {
        if (!el.statusToast) return;
        el.statusToast.textContent = msg;
        el.statusToast.classList.add("visible");
        clearTimeout(statusToastTimer);
        statusToastTimer = setTimeout(() => el.statusToast.classList.remove("visible"), 2000);
      }

      async function copyTextReliable(text) {
        if (!text) return false;
        try {
          const granted = window.lucent?.env?.grantedCapabilities || [];
          if (granted.includes("clipboard") && window.lucent?.bridge) {
            const res = await window.lucent.bridge("clipboard", "write", { text });
            if (res?.ok) return true;
          }
        } catch (_) {}
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {}
        return false;
      }

      function runExclusive(args, query = "") {
        const next = state.runChain.then(() => {
          if (state.closing || !window.lucent?.run) return null;
          return window.lucent.run(args, query);
        });
        state.runChain = next.catch(() => null);
        return next;
      }

      async function jumpBackToSession(sess) {
        if (!sess) {
          await window.lucent?.openExternal?.("file:///Applications/Antigravity.app");
          showStatusToast("已切到 Antigravity");
          return;
        }
        if (sess.source === "cli") {
          const cmd = sess.resumeCommand || `agy --conversation ${sess.sessionId}`;
          const ok = await copyTextReliable(cmd);
          showStatusToast(ok ? "已复制 CLI 续聊命令" : cmd);
          return;
        }
        try {
          const res = await runExclusive(["--focus-session", sess.sessionId || "", sess.title || ""], "");
          const payload = res?.data || (res?.stdout ? JSON.parse(res.stdout) : null);
          if (payload?.focused) {
            showStatusToast(payload.message || "已直达对应对话");
            if (state.docked && state.expanded) scheduleDockRetract(450);
            return;
          }
          if (sess.title) await copyTextReliable(sess.title);
          if (payload?.message) {
            showStatusToast(payload.message);
            return;
          }
        } catch (_) {}

        if (sess.title) await copyTextReliable(sess.title);
        await window.lucent?.openExternal?.("file:///Applications/Antigravity.app");
        showStatusToast("已切回 Antigravity · 标题已复制");
      }

      function escapeHTML(str) {
        return String(str || "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "\"": "&quot;" }[c]));
      }

      function formatTokens(n) {
        const v = Number(n || 0);
        const abs = Math.abs(v);
        if (abs >= 1e9) return `${(v / 1e9).toFixed(2)}B`;
        if (abs >= 1e6) return `${(v / 1e6).toFixed(2)}M`;
        if (abs >= 1e5) return `${Math.round(v / 1e3)}K`;
        if (abs >= 1e3) return `${(v / 1e3).toFixed(1)}K`;
        return String(Math.round(v));
      }

      function formatPct(r) {
        const c = Math.max(0, Math.min(1, Number(r || 0)));
        const p = c * 100;
        if (p === 0) return "0%";
        if (p < 0.1) return "<0.1%";
        return `${p.toFixed(1)}%`;
      }

      function formatUSD(v) {
        const num = Number(v || 0);
        return num < 0.005 ? "$0.00" : `$${num.toFixed(2)}`;
      }

      function formatTokPerSec(v, compact = false) {
        const n = Number(v);
        if (!Number.isFinite(n) || n <= 0) return "";
        const num = n >= 100 ? String(Math.round(n)) : n.toFixed(1);
        return compact ? `${num}t/s` : `${num} tok/s`;
      }

      function renderStripStatus(sess) {
        if (!sess) return;
        const isTop = state.edge === "top";
        const spd = formatTokPerSec(sess.avgOutputTokensPerSec, isTop);
        const spdFull = formatTokPerSec(sess.avgOutputTokensPerSec, false);
        const isFirstTurnOnly = sess.turnCount <= 1 && (sess.latestCacheReadTokens || 0) === 0;
        const cacheStr = isFirstTurnOnly ? "--" : formatPct(sess.cumulativeCacheHitRate || 0);
        const cachePillCls = sess.cacheDropped ? "crit" : (sess.cumulativeCacheHitRate >= 0.7 ? "good" : "warn");

        if (sess.activityState === "running") {
          el.stripStatus.textContent = spd ? (isTop ? `● ${spdFull}` : `● 运行中 · ${spd}`) : "● 运行中";
          el.stripStatus.className = "strip-status running tabular";
        } else if (sess.cacheDropped) {
          el.stripStatus.textContent = spd ? `掉缓存! · ${spd}` : "掉缓存!";
          el.stripStatus.className = "strip-status crit tabular";
        } else {
          const pctCompact = isTop && cacheStr.endsWith("%") ? `${Math.round(parseFloat(cacheStr))}%` : cacheStr;
          el.stripStatus.textContent = spd ? `✓ ${pctCompact} · ${spd}` : `✓ ${cacheStr}`;
          el.stripStatus.className = `strip-status ${cachePillCls === "good" ? "" : cachePillCls} tabular`;
        }
        el.stripStatus.title = spdFull ? `平均输出速度 ${spdFull}` : "";
      }

      function resolveTheme(env) {
        const queryTheme = new URLSearchParams(window.location.search).get("theme")?.toLowerCase();
        if (queryTheme === "dark" || queryTheme === "prism-pulse") return "dark";
        if (queryTheme === "light" || queryTheme === "pure-frost" || queryTheme === "white" || queryTheme === "champagne") {
          return "light";
        }
        const style = state.themeStyle || "auto";
        if (style === "dark") return "dark";
        if (style === "light") return "light";
        if (env && (env.appearance || env.theme)) {
          const isDark = env.appearance === "dark" || env.theme === "dark" || env.theme === "prism-pulse";
          return isDark ? "dark" : "light";
        }
        return darkMedia?.matches ? "dark" : "light";
      }

      function applyTheme(env) {
        const resolved = resolveTheme(env);
        if (document.documentElement.getAttribute("data-theme") !== resolved) {
          document.documentElement.setAttribute("data-theme", resolved);
        }
        drawSparkline();
      }

      function moveSegThumb(seg, activeBtn, animate = true) {
        if (!seg || !activeBtn) return;
        let thumb = seg.querySelector(".seg-thumb");
        if (!thumb) {
          thumb = document.createElement("span");
          thumb.className = "seg-thumb";
          thumb.setAttribute("aria-hidden", "true");
          seg.prepend(thumb);
        }
        const w = activeBtn.offsetWidth;
        const x = activeBtn.offsetLeft;
        if (w <= 0) return;

        const useAnim = animate && thumb.classList.contains("ready") && !reducedMotionMedia?.matches;
        if (!useAnim) {
          thumb.classList.add("no-anim");
          thumb.style.width = `${w}px`;
          thumb.style.transform = `translateX(${x}px) scaleX(1) scaleY(1)`;
          thumb.classList.add("ready");
          void thumb.offsetWidth;
          thumb.classList.remove("no-anim");
          return;
        }

        thumb.style.width = `${w}px`;
        thumb.style.transform = `translateX(${x}px) scaleX(1.10) scaleY(0.94)`;
        clearTimeout(thumb._stretchTimer);
        thumb._stretchTimer = setTimeout(() => {
          thumb.style.transform = `translateX(${x}px) scaleX(1) scaleY(1)`;
        }, 125);
      }

      function syncAllSegThumbs(animate = false) {
        document.querySelectorAll(".ios-seg").forEach((seg) => {
          const active = seg.querySelector("button.active") || seg.querySelector("button");
          if (active) moveSegThumb(seg, active, animate);
        });
      }

      function spawnRippleAndBounce(target, ev) {
        if (!target || target.disabled || reducedMotionMedia?.matches) return;
        const rect = target.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const x = (ev && Number.isFinite(ev.clientX) && ev.clientX !== 0) ? ev.clientX - rect.left : rect.width * 0.5;
        const y = (ev && Number.isFinite(ev.clientY) && ev.clientY !== 0) ? ev.clientY - rect.top : rect.height * 0.5;
        const size = Math.max(rect.width, rect.height) * 1.15;

        const ripple = document.createElement("span");
        ripple.className = "lg-ripple";
        ripple.style.setProperty("--rx", `${x.toFixed(1)}px`);
        ripple.style.setProperty("--ry", `${y.toFixed(1)}px`);
        ripple.style.setProperty("--rs", `${size.toFixed(1)}px`);
        target.append(ripple);
        setTimeout(() => ripple.remove(), 500);

        if (target.matches(".session-pill, .open-sess-btn, .sheet-jump-btn, .all-link-btn")) {
          const gleam = document.createElement("span");
          gleam.className = "lg-gleam";
          target.append(gleam);
          setTimeout(() => gleam.remove(), 440);
        }

        target.classList.remove("is-bouncing");
        void target.offsetWidth;
        target.classList.add("is-bouncing");
        setTimeout(() => target.classList.remove("is-bouncing"), 360);
      }

      function triggerRowPress(row, ev) {
        if (!row || reducedMotionMedia?.matches) return;
        const rect = row.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const nx = ev && Number.isFinite(ev.clientX) ? ((ev.clientX - rect.left) / rect.width - 0.5) * 2 : 0;
        const ny = ev && Number.isFinite(ev.clientY) ? ((ev.clientY - rect.top) / rect.height - 0.5) * 2 : 0;
        row.style.setProperty("--press-rx", `${(-ny * 2.8).toFixed(2)}deg`);
        row.style.setProperty("--press-ry", `${(nx * 3.2).toFixed(2)}deg`);
        row.classList.add("is-pressing");
        setTimeout(() => row.classList.remove("is-pressing"), 140);

        row.classList.remove("is-glinting");
        void row.offsetWidth;
        row.classList.add("is-glinting");
        setTimeout(() => row.classList.remove("is-glinting"), 580);
      }

      function bindLiquidInteractions() {
        let rafId = 0;
        let lastX = 0;
        let lastY = 0;
        el.card.addEventListener("pointermove", (ev) => {
          if (reducedMotionMedia?.matches) return;
          lastX = ev.clientX;
          lastY = ev.clientY;
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            rafId = 0;
            const rect = el.card.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            const px = ((lastX - rect.left) / rect.width) * 100;
            const py = ((lastY - rect.top) / rect.height) * 100;
            el.card.style.setProperty("--mx", `${px.toFixed(1)}%`);
            el.card.style.setProperty("--my", `${py.toFixed(1)}%`);
            el.card.style.setProperty("--sheen-op", "1");
          });
        });
        el.card.addEventListener("pointerleave", () => {
          el.card.style.setProperty("--sheen-op", "0");
        });

        document.addEventListener("pointerdown", (ev) => {
          const btn = ev.target?.closest?.(".icon-btn, .session-pill, .all-link-btn, .open-sess-btn, .sheet-jump-btn");
          if (btn) {
            spawnRippleAndBounce(btn, ev);
            return;
          }
          const row = ev.target?.closest?.(".inline-sess-row, .sheet-row");
          if (row) {
            triggerRowPress(row, ev);
          }
        });
      }

      async function safeCloseWindow() {
        state.closing = true;
        clearHoverTimers();
        if (state.timer) clearInterval(state.timer);
        await window.lucent?.window?.close?.();
      }

      // --- 2-State Edge-Retractable <-> Full Large HUD Motion ---
      async function expandDockToFull() {
        if (!state.docked || state.expanded || state.morphing || state.closing) return;
        clearHoverTimers();
        state.morphing = true;
        state.expanded = true;
        state.ignoreAutoUntil = Date.now() + 700;
        syncDOMState();

        try {
          if (hasNativeMotion) {
            await window.lucent.window.morph({
              width: FULL_SIZE.w,
              height: FULL_SIZE.h,
              anchor: anchorForEdge(state.edge),
              durationMs: 340,
              easing: "spring",
              keepOnScreen: true
            });
          } else {
            await window.lucent?.window?.resize?.(FULL_SIZE.w, FULL_SIZE.h);
          }
          await window.lucent?.window?.setPinned?.(true);
          setTimeout(drawSparkline, 360);
        } finally {
          setTimeout(() => {
            state.morphing = false;
            if (!state.mouseInside && state.docked && state.expanded && !state.dragging && !el.sessionSheet.classList.contains("open")) {
              scheduleDockRetract(260);
            }
          }, 350);
        }
      }

      async function retractToDockStrip(edgeOverride = null) {
        if (state.morphing || state.closing) return;
        if (edgeOverride && EDGE_ORDER.includes(edgeOverride)) state.edge = edgeOverride;
        clearHoverTimers();
        closeSessionSheet();
        el.card.removeAttribute("data-near-edge");

        state.morphing = true;
        state.docked = true;
        state.expanded = false;
        state.ignoreAutoUntil = Date.now() + 820;
        state.ignoreHoverUntil = Date.now() + 400;
        syncDOMState();
        renderStripStatus(currentDisplayedSession());

        const sz = stripSizeForEdge(state.edge);
        try {
          if (hasNativeMotion) {
            await window.lucent.window.snapToEdge(state.edge, {
              width: sz.w, height: sz.h, margin: 0, durationMs: 320, easing: "spring"
            });
          } else {
            const res = await runExclusive(["--snap-dock", state.edge, window.lucent?.env?.windowId || "antigravity-pulse-hud"]);
            const data = res?.data || (res?.stdout ? JSON.parse(res.stdout) : null);
            await window.lucent?.window?.resize?.(sz.w, sz.h);
            if (data?.ok) await window.lucent?.window?.moveTo?.(data.x, data.y);
          }
          await window.lucent?.window?.setPinned?.(true);
        } finally {
          setTimeout(() => { state.morphing = false; }, 330);
        }
      }

      async function switchToFreeFloatingFull() {
        if (state.morphing || state.closing) return;
        clearHoverTimers();
        el.card.removeAttribute("data-near-edge");
        const wasCollapsed = !state.expanded;
        state.morphing = true;
        state.docked = false;
        state.expanded = true;
        state.ignoreAutoUntil = Date.now() + 820;
        syncDOMState();

        try {
          if (wasCollapsed) {
            if (hasNativeMotion) {
              await window.lucent.window.morph({
                width: FULL_SIZE.w,
                height: FULL_SIZE.h,
                anchor: anchorForEdge(state.edge),
                durationMs: 340,
                easing: "spring",
                keepOnScreen: true
              });
            } else {
              await window.lucent?.window?.resize?.(FULL_SIZE.w, FULL_SIZE.h);
            }
          }
          await window.lucent?.window?.setPinned?.(true);
          setTimeout(drawSparkline, 360);
        } finally {
          setTimeout(() => { state.morphing = false; }, 350);
        }
      }

      function scheduleDockExpand(delayMs = 110) {
        if (!state.docked || state.expanded || state.dragging || state.morphing || state.closing) return;
        if (Date.now() < state.ignoreHoverUntil) return;
        if (state.retractTimer) { clearTimeout(state.retractTimer); state.retractTimer = null; }
        if (state.expandTimer) return;
        state.expandTimer = setTimeout(() => {
          state.expandTimer = null;
          if (state.mouseInside && state.docked && !state.expanded && !state.dragging) {
            expandDockToFull();
          }
        }, delayMs);
      }

      function scheduleDockRetract(delayMs = 300) {
        if (!state.docked || !state.expanded || state.dragging || state.closing) return;
        if (el.sessionSheet.classList.contains("open")) return;
        if (state.expandTimer) { clearTimeout(state.expandTimer); state.expandTimer = null; }
        if (state.retractTimer) clearTimeout(state.retractTimer);
        state.retractTimer = setTimeout(() => {
          state.retractTimer = null;
          if (state.mouseInside || !state.docked || !state.expanded || state.dragging || state.closing) return;
          if (el.sessionSheet.classList.contains("open")) return;
          if (state.morphing) { scheduleDockRetract(140); return; }
          retractToDockStrip();
        }, delayMs);
      }

      function pickDockEdge(edges, threshold = 28) {
        if (!edges) return null;
        const candidates = [
          ["top", Number(edges.distTop)],
          ["left", Number(edges.distLeft)],
          ["right", Number(edges.distRight)]
        ].filter(([, d]) => Number.isFinite(d) && d <= threshold);
        if (!candidates.length) return null;
        candidates.sort((a, b) => a[1] - b[1]);
        return candidates[0][0];
      }

      async function handleNativeDragEnd(detail) {
        state.dragging = false;
        el.card.removeAttribute("data-near-edge");
        if (state.morphing || state.closing || Date.now() < state.ignoreAutoUntil) return;
        if (el.sessionSheet.classList.contains("open")) return;
        if (!detail || (detail.movedDistance !== undefined && detail.movedDistance < 4)) return;
        const edges = detail.edges;
        if (!edges) return;

        const near = pickDockEdge(edges, state.docked ? 36 : 28);
        if (near) {
          await retractToDockStrip(near);
          return;
        }
        if (state.docked) {
          const minDist = Math.min(Number(edges.distLeft), Number(edges.distRight), Number(edges.distTop));
          if (Number.isFinite(minDist) && minDist > 52) {
            await switchToFreeFloatingFull();
            showStatusToast("已切换为常驻大窗 · 拖到边缘可重新缩边");
          }
        }
      }

      // --- Rendering Helpers ---
      function dotClassForActivity(activityState, cacheDropped) {
        if (cacheDropped || activityState === "error") return "live-dot error";
        if (activityState === "running") return "live-dot running";
        if (activityState === "idle") return "live-dot idle";
        return "live-dot";
      }

      function tagClassForActivity(activityState) {
        if (activityState === "running") return "session-state-tag running";
        if (activityState === "error") return "session-state-tag error";
        if (activityState === "idle") return "session-state-tag idle";
        return "session-state-tag";
      }

      function findSessionIndex(list, sessionId) {
        if (!list || !list.length) return -1;
        if (!sessionId) return 0;
        const idx = list.findIndex((x) => x.sessionId === sessionId);
        return idx >= 0 ? idx : 0;
      }

      function currentDisplayedSession() {
        const list = state.snapshot?.recentSessions || [];
        if (state.pinnedSessionId) {
          const found = list.find((x) => x.sessionId === state.pinnedSessionId);
          if (found) return found;
        }
        return state.snapshot?.activeSession || list[0] || null;
      }

      function renderProjectTitles(sess, list) {
        const total = list ? list.length : 0;
        const idx = findSessionIndex(list, sess?.sessionId);
        const pager = total > 1 && idx >= 0 ? `${idx + 1}/${total}` : "";
        const proj = (sess?.projectName || "").trim();
        const title = (sess?.title || "Antigravity").trim();
        const fullLabel = proj ? `${proj} · ${title}` : title;
        const stripLabel = proj ? `${proj} · ${title}` : title;

        el.stdProjBadge.textContent = proj;
        el.stdTitle.textContent = title;
        el.stdPager.textContent = pager;
        el.sessionPillBtn.title = `${fullLabel}\n滚轮切换相邻活跃项目 · 点击查看全部`;

        el.stripTitle.textContent = stripLabel;
        el.stripPager.textContent = pager;
        el.stripView.title = `${fullLabel}\n悬停自动展开大窗 · 滚轮切换活跃项目`;
      }

      function flashTitleSwitch() {
        el.sessionPillBtn?.classList.add("switch-flash");
        el.stripView?.classList.add("switch-flash");
        clearTimeout(state.flashTimer);
        state.flashTimer = setTimeout(() => {
          el.sessionPillBtn?.classList.remove("switch-flash");
          el.stripView?.classList.remove("switch-flash");
        }, 220);
      }

      function updateCacheView(sess) {
        if (!sess) return;
        const isLast = state.cacheScope === "last";
        const rate = isLast ? sess.latestCacheHitRate : sess.cumulativeCacheHitRate;
        const isFirstTurnOnly = sess.turnCount <= 1 && sess.latestCacheReadTokens === 0;

        el.cacheRateVal.textContent = isFirstTurnOnly ? "--" : formatPct(rate);
        el.cacheRateVal.className = "stat-value tabular";
        el.cacheTile.classList.toggle("warn-tile", Boolean(sess.cacheDropped));

        if (sess.cacheDropped) {
          el.cacheRateVal.classList.add("crit");
          el.cacheSubVal.textContent = `掉缓存 · 上轮 ${formatPct(sess.cacheDropPrevRate || 0)}`;
        } else if (isFirstTurnOnly) {
          el.cacheSubVal.textContent = "首轮建缓存中";
        } else if (rate >= 0.70) {
          el.cacheRateVal.classList.add("good");
          el.cacheSubVal.textContent = isLast
            ? `本轮读 ${formatTokens(sess.latestCacheReadTokens)}`
            : `已省 ${formatUSD(sess.estimatedSavedUSD)} · ${sess.turnCount}轮`;
        } else if (rate >= 0.35) {
          el.cacheRateVal.classList.add("warn");
          el.cacheSubVal.textContent = isLast
            ? `本轮读 ${formatTokens(sess.latestCacheReadTokens)}`
            : `已省 ${formatUSD(sess.estimatedSavedUSD)} · ${sess.turnCount}轮`;
        } else {
          el.cacheRateVal.classList.add("crit");
          el.cacheSubVal.textContent = isLast ? "本轮命中偏低" : `累计读 ${formatTokens(sess.cumulativeCacheReadTokens)}`;
        }
      }

      function updateWindowView(snap) {
        if (!snap) return;
        const w = state.winScope === "7d"
          ? snap.window7d
          : (state.winScope === "today" ? snap.windowToday : snap.window5h);
        if (!w) return;

        const net = (w.netTokens !== undefined && w.netTokens !== null)
          ? w.netTokens
          : (Number(w.inputTokens || 0) + Number(w.outputTokens || 0));
        const spdStr = formatTokPerSec(w.avgTokensPerSec);
        el.winTotalVal.textContent = formatTokens(net);
        el.winSpeedVal.textContent = spdStr;
        el.winSpeedVal.title = (spdStr && w.timedDurationSeconds > 0)
          ? `所选周期加权均速 ${spdStr}（${formatTokens(w.timedOutputTokens)} tokens / ${Number(w.timedDurationSeconds).toFixed(1)}s）`
          : "所选周期平均输出速度";
        el.winSubVal.textContent = `含缓存 ${formatTokens(w.totalTokens)} · ${w.turns}轮`;
        el.winSubVal.title = `新输入 ${formatTokens(w.inputTokens)} · 输出 ${formatTokens(w.outputTokens)} · 缓存读 ${formatTokens(w.cacheReadTokens)}${spdStr ? ` · 均速 ${spdStr}` : ""} · 估算 ${formatUSD(w.estimatedCostUSD)}`;
      }

      function renderInlineSessions(snap, activeIdOverride = null) {
        const list = snap?.recentSessions || [];
        const runCnt = Number(snap?.runningCount || 0);
        const doneCnt = Number(snap?.completedCount || 0);
        el.recentCountMeta.textContent = runCnt > 0 ? `${runCnt}运行 · ${doneCnt}完成` : `${doneCnt} 已完成`;
        el.inlineSessionsList.innerHTML = "";

        if (list.length === 0) {
          el.inlineSessionsList.innerHTML = `<div class="panel-sub" style="padding:10px 4px;">暂无最近会话记录</div>`;
          return;
        }

        const activeId = activeIdOverride || state.pinnedSessionId || snap?.activeSession?.sessionId || list[0].sessionId;
        const activeIdx = Math.max(0, findSessionIndex(list, activeId));
        let start = 0;
        if (list.length > 3) {
          start = Math.max(0, Math.min(activeIdx - 1, list.length - 3));
        }

        for (const item of list.slice(start, start + 3)) {
          const row = document.createElement("div");
          row.className = "inline-sess-row" + (item.sessionId === activeId ? " active-row" : "");
          const dotCls = dotClassForActivity(item.activityState, false);
          const tagCls = tagClassForActivity(item.activityState);
          const cta = item.source === "cli" ? "命令" : "直达↗";
          const projHtml = item.projectName ? `<span class="proj-badge">${escapeHTML(item.projectName)}</span>` : "";
          const tipTitle = item.projectName ? `${item.projectName} · ${item.title}` : item.title;

          row.innerHTML = `
            <div class="inline-sess-left">
              <span class="${dotCls}"></span>
              ${projHtml}
              <span class="inline-sess-title" title="${escapeHTML(tipTitle)}">${escapeHTML(item.title)}</span>
            </div>
            <div class="inline-sess-right">
              <span class="${tagCls}">${escapeHTML(item.activityLabel)}</span>
              <button class="open-sess-btn" type="button" title="${item.source === "cli" ? "复制 CLI 续聊命令" : "直达 Antigravity 对应对话"}">${cta}</button>
            </div>
          `;
          row.addEventListener("click", (e) => {
            if (e.target.closest(".open-sess-btn")) return;
            const idx = findSessionIndex(list, item.sessionId);
            state.pinnedSessionId = idx === 0 ? "" : item.sessionId;
            applyOptimisticSessionPreview(item, list);
            fetchSnapshot(true);
          });
          row.querySelector(".open-sess-btn")?.addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = findSessionIndex(list, item.sessionId);
            state.pinnedSessionId = idx === 0 ? "" : item.sessionId;
            jumpBackToSession(item);
          });
          el.inlineSessionsList.appendChild(row);
        }
      }

      function applyOptimisticSessionPreview(item, list) {
        if (!item) return;
        renderProjectTitles(item, list);
        flashTitleSwitch();

        const ratio = Math.max(0, item.contextRatio || 0);
        const health = ratio >= 0.85 || item.activityState === "error"
          ? "crit"
          : (item.activityState === "running" ? "running" : (ratio >= 0.70 ? "warn" : "good"));
        el.card.setAttribute("data-health", health);

        const dotCls = dotClassForActivity(item.activityState, false);
        const tagCls = tagClassForActivity(item.activityState);
        el.liveDot.className = dotCls;
        el.stripDot.className = dotCls;
        el.stateTag.textContent = item.activityLabel;
        el.stateTag.className = tagCls;
        el.modelLabel.textContent = item.modelShortName;

        const ctxStr = formatTokens(item.contextTokens);
        const pctStr = formatPct(ratio);
        el.ctxBig.textContent = ctxStr;
        if (item.contextLimit) el.ctxLimit.textContent = `/ ${formatTokens(item.contextLimit)}`;
        el.ctxPctPill.textContent = pctStr;
        el.ctxPctPill.className = "status-pill tabular" + (ratio >= 0.85 ? " crit" : (ratio >= 0.70 ? " warn" : ""));

        const totalPct = Math.min(100, ratio * 100);
        const approxCachePct = Math.min(totalPct, totalPct * Math.max(0, Math.min(1, item.cumulativeCacheHitRate || 0)));
        const approxInputPct = Math.max(0, totalPct - approxCachePct);
        const inputCls = "bar-seg-input" + (ratio >= 0.85 ? " crit" : (ratio >= 0.70 ? " warn" : ""));
        el.segCache.style.width = `${approxCachePct.toFixed(2)}%`;
        el.segInput.style.width = `${approxInputPct.toFixed(2)}%`;
        el.segInput.className = inputCls;

        el.stripCtx.textContent = ctxStr;
        el.stripPct.textContent = pctStr;
        renderStripStatus(item);

        if (state.snapshot) renderInlineSessions(state.snapshot, item.sessionId);
      }

      function cycleAdjacentSession(step) {
        const list = state.snapshot?.recentSessions || [];
        if (list.length <= 1) {
          showStatusToast("暂无其他相邻活跃项目");
          return;
        }
        if (state.retractTimer) { clearTimeout(state.retractTimer); state.retractTimer = null; }
        const currentId = state.pinnedSessionId || state.snapshot?.activeSession?.sessionId || list[0].sessionId;
        const curIdx = Math.max(0, findSessionIndex(list, currentId));
        const nextIdx = (curIdx + step + list.length) % list.length;
        const target = list[nextIdx];
        state.pinnedSessionId = nextIdx === 0 ? "" : target.sessionId;

        applyOptimisticSessionPreview(target, list);

        clearTimeout(state.wheelFetchTimer);
        state.wheelFetchTimer = setTimeout(() => fetchSnapshot(false), 95);
      }

      function openSessionSheet() {
        renderSessionSheet();
        el.card.classList.add("sheet-open");
        el.sessionSheet.classList.add("open");
        el.sessionSheet.setAttribute("aria-hidden", "false");
        clearHoverTimers();
      }

      function closeSessionSheet() {
        el.card.classList.remove("sheet-open");
        el.sessionSheet.classList.remove("open");
        el.sessionSheet.setAttribute("aria-hidden", "true");
        if (state.docked && state.expanded && !state.mouseInside) {
          scheduleDockRetract(260);
        }
      }

      function renderSessionSheet() {
        const snap = state.snapshot;
        const list = snap?.recentSessions || [];
        el.sheetSummary.textContent = `${Number(snap?.runningCount || 0)} 运行中 · ${Number(snap?.completedCount || 0)} 已完成`;
        el.sheetList.innerHTML = "";

        const autoRow = document.createElement("div");
        autoRow.className = "sheet-row" + (state.pinnedSessionId === "" ? " selected" : "");
        autoRow.innerHTML = `
          <div class="sheet-row-top">
            <span class="sheet-row-title-wrap"><span class="live-dot"></span><span class="sheet-row-title">自动跟随最新活跃会话</span></span>
            <span class="session-state-tag">AUTO</span>
          </div>
          <div class="sheet-row-sub"><span>始终锁定刚更新的对话</span><span>点击任意行切换监控</span></div>
        `;
        autoRow.addEventListener("click", () => {
          state.pinnedSessionId = "";
          closeSessionSheet();
          fetchSnapshot(true);
        });
        el.sheetList.appendChild(autoRow);

        for (const item of list) {
          const row = document.createElement("div");
          row.className = "sheet-row" + (state.pinnedSessionId === item.sessionId ? " selected" : "");
          const dotCls = dotClassForActivity(item.activityState, false);
          const tagCls = tagClassForActivity(item.activityState);
          const jumpText = item.source === "cli" ? "复制命令" : "直达 ↗";
          const projHtml = item.projectName ? `<span class="proj-badge">${escapeHTML(item.projectName)}</span>` : "";

          row.innerHTML = `
            <div class="sheet-row-top">
              <span class="sheet-row-title-wrap">
                <span class="${dotCls}"></span>
                ${projHtml}
                <span class="sheet-row-title">${escapeHTML(item.title)}</span>
              </span>
              <span class="sheet-row-actions">
                <span class="${tagCls}">${escapeHTML(item.activityLabel)}</span>
                <button class="sheet-jump-btn" type="button">${jumpText}</button>
              </span>
            </div>
            <div class="sheet-row-sub">
              <span>${escapeHTML(item.modelShortName)} · ${formatTokens(item.contextTokens)} · 缓存 ${formatPct(item.cumulativeCacheHitRate)}${formatTokPerSec(item.avgOutputTokensPerSec) ? ` · ${formatTokPerSec(item.avgOutputTokensPerSec)}` : ""}</span>
              <span>${escapeHTML(item.updatedLabel)}</span>
            </div>
          `;
          row.addEventListener("click", (e) => {
            if (e.target.closest(".sheet-jump-btn")) return;
            const idx = findSessionIndex(list, item.sessionId);
            state.pinnedSessionId = idx === 0 ? "" : item.sessionId;
            closeSessionSheet();
            applyOptimisticSessionPreview(item, list);
            fetchSnapshot(true);
          });
          row.querySelector(".sheet-jump-btn")?.addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = findSessionIndex(list, item.sessionId);
            state.pinnedSessionId = idx === 0 ? "" : item.sessionId;
            jumpBackToSession(item);
          });
          el.sheetList.appendChild(row);
        }
      }

      function renderSnapshot(snap) {
        state.snapshot = snap;
        if (snap.themeStyle && snap.themeStyle !== state.themeStyle) {
          state.themeStyle = snap.themeStyle;
          applyTheme(window.lucent?.env);
        }
        if (snap.dockState?.pendingSnap && snap.dockState.fromMode) {
          const req = snap.dockState.fromMode;
          const edge = EDGE_ORDER.includes(snap.dockState.edge) ? snap.dockState.edge : state.edge;
          if (req === "standard") switchToFreeFloatingFull();
