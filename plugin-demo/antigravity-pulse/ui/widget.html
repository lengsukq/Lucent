          else retractToDockStrip(edge);
        }
        if (snap.defaultMode) {
          if (state.lastConfigMode !== null && state.lastConfigMode !== snap.defaultMode) {
            state.lastConfigMode = snap.defaultMode;
            if (snap.defaultMode === "standard") switchToFreeFloatingFull();
            else retractToDockStrip(state.edge);
          } else {
            state.lastConfigMode = snap.defaultMode;
          }
        }
        if (snap.refreshIntervalSec && snap.refreshIntervalSec !== state.refreshSec) {
          state.refreshSec = snap.refreshIntervalSec;
          restartPolling();
        }

        updateWindowView(snap);
        renderInlineSessions(snap);

        const sess = snap.activeSession;
        if (!sess) {
          el.liveDot.className = "live-dot idle";
          el.stripDot.className = "live-dot idle";
          renderProjectTitles({ projectName: "", title: "等待 Antigravity", sessionId: "" }, []);
          el.modelLabel.textContent = "";
          el.stateTag.textContent = "空闲";
          el.stateTag.className = "session-state-tag idle";
          el.ctxBig.textContent = "--";
          el.ctxLimit.textContent = "";
          el.ctxPctPill.textContent = "空闲";
          el.legendOutput.textContent = "输出 --";
          el.legendOutput.title = "";
          el.stripCtx.textContent = "--";
          el.stripPct.textContent = "";
          el.stripStatus.textContent = "空闲";
          el.stripStatus.className = "strip-status tabular";
          el.stripStatus.title = "";
          return;
        }

        renderProjectTitles(sess, snap.recentSessions || []);

        const ratio = Math.max(0, sess.contextRatio || 0);
        const health = sess.cacheDropped || ratio >= 0.85 || sess.activityState === "error"
          ? "crit"
          : (sess.activityState === "running" ? "running" : (ratio >= 0.70 ? "warn" : "good"));
        el.card.setAttribute("data-health", health);

        const dotCls = dotClassForActivity(sess.activityState, sess.cacheDropped);
        const tagCls = tagClassForActivity(sess.activityState);
        el.liveDot.className = dotCls;
        el.stripDot.className = dotCls;
        el.stateTag.textContent = sess.activityLabel;
        el.stateTag.className = tagCls;
        el.modelLabel.textContent = sess.modelShortName;

        const ctxStr = formatTokens(sess.contextTokens);
        const pctStr = formatPct(ratio);
        el.ctxBig.textContent = ctxStr;
        el.ctxLimit.textContent = `/ ${formatTokens(sess.contextLimit)}`;
        el.ctxPctPill.textContent = pctStr;
        el.ctxPctPill.className = "status-pill tabular" + (ratio >= 0.85 ? " crit" : (ratio >= 0.70 ? " warn" : ""));

        const totalLimit = Math.max(1, sess.contextLimit);
        const cacheWidth = Math.min(100, (sess.latestCacheReadTokens / totalLimit) * 100);
        const inputWidth = Math.min(100 - cacheWidth, (sess.latestInputTokens / totalLimit) * 100);
        const inputCls = "bar-seg-input" + (ratio >= 0.85 ? " crit" : (ratio >= 0.70 ? " warn" : ""));

        el.segCache.style.width = `${cacheWidth.toFixed(2)}%`;
        el.segInput.style.width = `${inputWidth.toFixed(2)}%`;
        el.segInput.className = inputCls;

        el.legendCache.textContent = `缓存 ${formatTokens(sess.latestCacheReadTokens)}`;
        el.legendInput.textContent = `新输入 ${formatTokens(sess.latestInputTokens)}`;
        const sessSpd = formatTokPerSec(sess.avgOutputTokensPerSec);
        el.legendOutput.textContent = sessSpd
          ? `输出 ${formatTokens(sess.latestOutputTokens)} · 均 ${sessSpd}`
          : `输出 ${formatTokens(sess.latestOutputTokens)}`;
        el.legendOutput.title = (sessSpd && sess.totalOutputDurationSeconds > 0)
          ? `本轮输出 ${formatTokens(sess.latestOutputTokens)} · 会话平均速度 ${sessSpd}（累计输出 ${formatTokens(sess.cumulativeOutputTokens)} / ${Number(sess.totalOutputDurationSeconds).toFixed(1)}s）`
          : `本轮输出 ${formatTokens(sess.latestOutputTokens)} · 累计输出 ${formatTokens(sess.cumulativeOutputTokens)}`;

        updateCacheView(sess);

        el.stripCtx.textContent = ctxStr;
        el.stripPct.textContent = pctStr;
        renderStripStatus(sess);

        if (snap.alertBanner?.title) {
          const alertKey = `${snap.alertBanner.sessionId || sess.sessionId}:${sess.latestStep}:${snap.alertBanner.kind}`;
          if (alertKey !== state.lastAlertKey) {
            state.lastAlertKey = alertKey;
            state.bannerPayload = snap.alertBanner;
            const isDoneBanner = snap.alertBanner.kind === "session_done";
            el.alertBanner.classList.toggle("done-banner", isDoneBanner);
            el.alertBannerText.textContent = `${snap.alertBanner.title} · ${snap.alertBanner.detail}`;
            el.alertBannerCta.textContent = snap.alertBanner.source === "cli" ? "复制命令" : "直达 ↗";
            el.alertBanner.classList.add("visible");
            el.card.classList.toggle("done-ring", isDoneBanner);
            el.card.classList.toggle("alert-ring", !isDoneBanner);
            clearTimeout(state.bannerTimer);
            state.bannerTimer = setTimeout(() => {
              el.alertBanner.classList.remove("visible");
              el.card.classList.remove("alert-ring", "done-ring");
            }, isDoneBanner ? 7000 : 5000);
          }
        }

        if (el.sessionSheet.classList.contains("open")) renderSessionSheet();
        drawSparkline();
      }

      function drawSparkline() {
        if ((state.docked && !state.expanded) || state.bottomTab !== "chart") return;
        const turns = state.snapshot?.activeSession?.turns || [];
        const rect = el.sparkBox.getBoundingClientRect();
        if (rect.width <= 4 || rect.height <= 4) return;

        const dpr = window.devicePixelRatio || 1;
        el.sparkCanvas.width = Math.round(rect.width * dpr);
        el.sparkCanvas.height = Math.round(rect.height * dpr);
        const ctx = el.sparkCanvas.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, rect.width, rect.height);
        if (turns.length === 0) return;

        let maxVal = 1000;
        for (const t of turns) { if (t.contextTokens > maxVal) maxVal = t.contextTokens; }
        maxVal *= 1.12;

        const padX = 4, padY = 6;
        const w = rect.width - padX * 2, h = rect.height - padY * 2;
        const xAt = (i) => turns.length === 1 ? padX + w * 0.5 : padX + (i / (turns.length - 1)) * w;
        const yAt = (v) => padY + (1 - Math.max(0, v) / maxVal) * h;

        const cs = getComputedStyle(document.documentElement);
        const stroke = cs.getPropertyValue("--ios-blue-text").trim() || "#0071E3";
        const green = cs.getPropertyValue("--ios-green-bar").trim() || "#34C759";
        const red = cs.getPropertyValue("--ios-red-bar").trim() || "#FF3B30";

        ctx.beginPath();
        turns.forEach((pt, idx) => {
          const x = xAt(idx), y = yAt(pt.contextTokens);
          if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.lineTo(xAt(turns.length - 1), rect.height);
        ctx.lineTo(xAt(0), rect.height);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, padY, 0, rect.height);
        grad.addColorStop(0, stroke + "2E");
        grad.addColorStop(1, stroke + "02");
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.75;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        turns.forEach((pt, idx) => {
          const x = xAt(idx), y = yAt(pt.contextTokens);
          if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        const lastIdx = turns.length - 1;
        const lx = xAt(lastIdx), ly = yAt(turns[lastIdx].contextTokens);
        const lastColor = state.snapshot?.activeSession?.cacheDropped ? red : (state.snapshot?.activeSession?.activityState === "running" ? stroke : green);
        ctx.fillStyle = lastColor + "33";
        ctx.beginPath(); ctx.arc(lx, ly, 4.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = lastColor;
        ctx.beginPath(); ctx.arc(lx, ly, 2.4, 0, Math.PI * 2); ctx.fill();

        if (state.hoverIndex !== null && turns[state.hoverIndex]) {
          const pt = turns[state.hoverIndex];
          const hx = xAt(state.hoverIndex), hy = yAt(pt.contextTokens);
          ctx.strokeStyle = cs.getPropertyValue("--label-tertiary").trim() || "#8E8E93";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(hx, 2); ctx.lineTo(hx, rect.height - 2); ctx.stroke();
          ctx.fillStyle = "#FFFFFF";
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.arc(hx, hy, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          const ptSpd = formatTokPerSec(pt.tokensPerSec);
          el.hoverTip.textContent = `#${pt.step} · ${formatTokens(pt.contextTokens)} · 缓存 ${formatPct(pt.cacheHitRate)}${ptSpd ? ` · ${ptSpd}` : ""} · ${pt.time}`;
          el.hoverTip.classList.add("visible");
        } else {
          el.hoverTip.classList.remove("visible");
        }
      }

      async function fetchSnapshot(manual = false) {
        if (state.closing) return;
        if (state.fetching) {
          state.pendingRefetch = true;
          return;
        }
        state.fetching = true;
        if (manual) {
          el.liveDot.className = "live-dot loading";
          el.stripDot.className = "live-dot loading";
        }
        try {
          const args = state.pinnedSessionId ? ["--snapshot", state.pinnedSessionId] : ["--snapshot"];
          const res = await runExclusive(args, "");
          const payload = res?.data || (res?.stdout ? JSON.parse(res.stdout) : null);
          if (payload) renderSnapshot(payload);
        } catch (_) {
          el.liveDot.className = "live-dot error";
          el.stripDot.className = "live-dot error";
        } finally {
          state.fetching = false;
          if (state.pendingRefetch && !state.closing) {
            state.pendingRefetch = false;
            fetchSnapshot(false);
          }
        }
      }

      function restartPolling() {
        if (state.timer) clearInterval(state.timer);
        state.timer = setInterval(() => fetchSnapshot(false), Math.max(2, state.refreshSec) * 1000);
      }

      // --- Hover-Expand & Auto-Retract Event Wiring ---
      function markPointerInside() {
        state.mouseInside = true;
        if (state.retractTimer) { clearTimeout(state.retractTimer); state.retractTimer = null; }
        if (state.docked && !state.expanded) scheduleDockExpand(110);
      }
      function markPointerLeft() {
        state.mouseInside = false;
        if (state.expandTimer) { clearTimeout(state.expandTimer); state.expandTimer = null; }
        if (state.docked && state.expanded) scheduleDockRetract(300);
      }

      el.card.addEventListener("pointerenter", markPointerInside);
      el.card.addEventListener("mouseenter", markPointerInside);
      el.card.addEventListener("pointermove", () => {
        if (!state.mouseInside) markPointerInside();
        else if (state.retractTimer) { clearTimeout(state.retractTimer); state.retractTimer = null; }
      });
      document.documentElement.addEventListener("mouseleave", markPointerLeft);
      el.stage.addEventListener("pointerleave", markPointerLeft);

      // Click collapsed strip -> expand immediately
      el.stripView.addEventListener("click", () => {
        if (state.docked && !state.expanded) expandDockToFull();
      });

      // Mouse Wheel Switching (Collapsed Strip + Expanded Full HUD)
      el.card.addEventListener("wheel", (e) => {
        if (el.sessionSheet.classList.contains("open") && e.target.closest(".sheet-list")) return;
        e.preventDefault();
        const raw = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        if (!Number.isFinite(raw) || Math.abs(raw) < 1) return;
        const scale = e.deltaMode === 1 ? 24 : (e.deltaMode === 2 ? 120 : 1);
        const delta = raw * scale;
        const now = Date.now();
        if (now - state.wheelLastEventAt > 180) state.wheelAccum = 0;
        state.wheelLastEventAt = now;
        if (now - state.wheelLastSwitchAt < 230) return;
        state.wheelAccum += delta;
        if (Math.abs(state.wheelAccum) >= 24) {
          const step = state.wheelAccum > 0 ? 1 : -1;
          state.wheelAccum = 0;
          state.wheelLastSwitchAt = now;
          cycleAdjacentSession(step);
        }
      }, { passive: false });

      window.addEventListener("keydown", (e) => {
        if (el.sessionSheet.classList.contains("open")) {
          if (e.key === "Escape") closeSessionSheet();
          return;
        }
        if (e.key === "ArrowDown" || e.key === "ArrowRight") {
          e.preventDefault();
          cycleAdjacentSession(1);
        } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
          e.preventDefault();
          cycleAdjacentSession(-1);
        }
      });

      // Native Drag (expanded card tiles/header & sheet header are draggable while interactive rows/buttons stay clickable)
      el.card.addEventListener("pointerdown", async (e) => {
        if (e.target.closest("button, input, select, .sheet-list, .alert-banner, .inline-sess-row, canvas")) return;
        state.dragging = true;
        clearHoverTimers();
        await window.lucent?.window?.startDrag?.();
        setTimeout(() => { state.dragging = false; }, 120);
      });

      {
        let sessionPillDragged = false;
        el.sessionPillBtn.addEventListener("mousedown", (ev) => {
          if (ev.button !== 0) return;
          sessionPillDragged = false;
          const sx = ev.clientX;
          const sy = ev.clientY;
          const cleanup = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", cleanup);
          };
          const onMove = (mv) => {
            if (Math.hypot(mv.clientX - sx, mv.clientY - sy) >= 4) {
              sessionPillDragged = true;
              cleanup();
              state.dragging = true;
              clearHoverTimers();
              window.lucent?.window?.startDrag?.();
              setTimeout(() => { state.dragging = false; }, 120);
            }
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", cleanup);
        });
        el.sessionPillBtn.addEventListener("click", () => {
          if (sessionPillDragged) {
            sessionPillDragged = false;
            return;
          }
          openSessionSheet();
        });
      }
      el.allSessionsBtn.addEventListener("click", openSessionSheet);
      el.closeSheetBtn.addEventListener("click", closeSessionSheet);
      el.returnAgyBtn.addEventListener("click", () => jumpBackToSession(currentDisplayedSession()));

      el.dockModeBtn.addEventListener("click", () => {
        if (state.docked) {
          switchToFreeFloatingFull();
          showStatusToast("已固定为常驻大窗");
        } else {
          retractToDockStrip(state.edge);
        }
      });
      el.edgeCycleBtn.addEventListener("click", () => {
        const next = EDGE_ORDER[(EDGE_ORDER.indexOf(state.edge) + 1) % EDGE_ORDER.length];
        retractToDockStrip(next);
      });
      el.opacityBtn.addEventListener("click", async () => {
        state.opacityIdx = (state.opacityIdx + 1) % state.opacityLevels.length;
        await window.lucent?.window?.setOpacity?.(state.opacityLevels[state.opacityIdx], { animate: true, durationMs: 180 });
      });
      el.closeBtn.addEventListener("click", () => safeCloseWindow());

      el.alertBanner.addEventListener("click", () => {
        const bp = state.bannerPayload;
        el.alertBanner.classList.remove("visible");
        el.card.classList.remove("alert-ring", "done-ring");
        if (bp) {
          jumpBackToSession({
            sessionId: bp.sessionId,
            source: bp.source,
            resumeURL: bp.resumeURL,
            resumeCommand: bp.resumeCommand,
            title: ""
          });
        }
      });

      document.querySelectorAll(".cache-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.cacheScope = btn.getAttribute("data-scope") || "cum";
          document.querySelectorAll(".cache-tab").forEach((b) => b.classList.toggle("active", b === btn));
          moveSegThumb(btn.closest(".ios-seg"), btn, true);
          updateCacheView(state.snapshot?.activeSession);
        });
      });
      document.querySelectorAll(".win-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.winScope = btn.getAttribute("data-win") || "5h";
          document.querySelectorAll(".win-tab").forEach((b) => b.classList.toggle("active", b === btn));
          moveSegThumb(btn.closest(".ios-seg"), btn, true);
          updateWindowView(state.snapshot);
        });
      });
      document.querySelectorAll(".panel-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.bottomTab = btn.getAttribute("data-panel") || "sessions";
          el.bottomPanel.setAttribute("data-tab", state.bottomTab);
          document.querySelectorAll(".panel-tab").forEach((b) => b.classList.toggle("active", b === btn));
          moveSegThumb(btn.closest(".ios-seg"), btn, true);
          if (state.bottomTab === "chart") setTimeout(drawSparkline, 20);
        });
      });

      el.sparkBox.addEventListener("pointermove", (e) => {
        const turns = state.snapshot?.activeSession?.turns;
        if (!turns || turns.length === 0) return;
        const rect = el.sparkBox.getBoundingClientRect();
        const rel = Math.max(0, Math.min(1, (e.clientX - rect.left - 4) / Math.max(1, rect.width - 8)));
        state.hoverIndex = Math.round(rel * (turns.length - 1));
        drawSparkline();
      });
      el.sparkBox.addEventListener("pointerleave", () => { state.hoverIndex = null; drawSparkline(); });

      new ResizeObserver(() => {
        drawSparkline();
        syncAllSegThumbs(false);
      }).observe(el.card);

      if (window.lucent?.onEnvChanged) {
        window.lucent.onEnvChanged((env) => applyTheme(env || window.lucent?.env));
      } else {
        window.addEventListener("lucent:envChanged", (e) => applyTheme(e?.detail || window.lucent?.env));
      }
      if (darkMedia) {
        const onSchemeChange = () => applyTheme(window.lucent?.env);
        if (typeof darkMedia.addEventListener === "function") darkMedia.addEventListener("change", onSchemeChange);
        else if (typeof darkMedia.addListener === "function") darkMedia.addListener(onSchemeChange);
      }
      window.addEventListener("pagehide", () => { state.closing = true; clearHoverTimers(); if (state.timer) clearInterval(state.timer); });

      bindLiquidInteractions();
      applyTheme(window.lucent?.env);
      syncDOMState();
      syncAllSegThumbs(false);
      window.lucent?.window?.setPinned?.(true);
      if (hasNativeMotion) {
        window.lucent.window.setEdgeBehavior?.({ keepOnScreen: true, autoClampOnDrag: true, edgeThreshold: 28 });
        window.lucent.window.onEdgeProximity?.((detail) => {
          const edge = detail?.edge;
          if (edge && EDGE_ORDER.includes(edge)) el.card.setAttribute("data-near-edge", edge);
          else el.card.removeAttribute("data-near-edge");
        });
        window.lucent.window.onDragEnd?.((detail) => handleNativeDragEnd(detail));
        if (state.docked && !state.expanded) {
          const sz = stripSizeForEdge(state.edge);
          if (Math.abs(window.innerWidth - sz.w) > 2 || Math.abs(window.innerHeight - sz.h) > 2) {
            window.lucent.window.snapToEdge(state.edge, { width: sz.w, height: sz.h, margin: 0, durationMs: 0 });
          }
        }
      }

      fetchSnapshot(true);
      restartPolling();
    })();
  </script>
</body>
</html>
