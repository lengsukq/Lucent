<!doctype html>
<html lang="zh-Hans" data-theme="pure-frost" data-mode="expanded">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file:;">
  <title>Audio Presets</title>
  <link rel="stylesheet" href="audio.css">
  <script src="audio.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <!-- Compact edge-docked pill -->
    <div id="mini-pill" class="mini-pill" data-lucent-drag hidden>
      <button id="expand-pill" class="pill-main" type="button" data-lucent-no-drag>
        <span class="squircle mini" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12h2.5M9 7v10M13 4v16M17 8v8M20 12h.5"/></svg>
        </span>
        <span id="pill-label" class="pill-label"></span>
      </button>
      <button id="pill-close" class="icon-btn compact" type="button" data-label="close" data-lucent-no-drag>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <!-- Full expanded console -->
    <div id="full-view" class="full-view">
      <div class="grip-bar" id="grip-bar" data-lucent-drag>
        <span class="grip-pill" aria-hidden="true"></span>
      </div>

      <header class="topbar" data-lucent-drag>
        <div class="brand">
          <span class="squircle" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 12h2.5M9 7v10M13 4v16M17 8v8M20 12h.5"/></svg>
          </span>
          <div class="brand-meta">
            <h1 id="app-title" data-text="appTitle"></h1>
            <span id="app-subtitle" class="brand-sub" data-text="current"></span>
          </div>
        </div>
        <div class="topbar-actions" data-lucent-no-drag>
          <button id="refresh" class="icon-btn" type="button" data-label="refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.4 5.7"/></svg>
          </button>
          <button id="pin-toggle" class="icon-btn" type="button" data-label="pin" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M8 4h8l-1 5 3 3v2H6v-2l3-3-1-5z"/></svg>
          </button>
          <button id="dock-toggle" class="icon-btn" type="button" data-label="dock">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M15 4v16"/></svg>
          </button>
          <button id="close-win" class="icon-btn" type="button" data-label="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <section aria-labelledby="app-subtitle">
          <div class="devices">
            <button type="button" class="device glass-card" id="output-card" data-direction="output">
              <div class="device-top">
                <span class="device-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11"/></svg>
                </span>
                <span class="chevron" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
                </span>
              </div>
              <div class="device-label" data-text="output"></div>
              <p id="output" class="device-name"></p>
            </button>

            <button type="button" class="device glass-card" id="input-card" data-direction="input">
              <div class="device-top">
                <span class="device-icon mic" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0m-6 6v3m-3 0h6"/></svg>
                </span>
                <span class="chevron" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
                </span>
              </div>
              <div class="device-label" data-text="input"></div>
              <p id="input" class="device-name"></p>
            </button>
          </div>

          <div id="quick-picker" class="quick-picker glass-card" hidden>
            <div class="picker-head">
              <span id="picker-title"></span>
              <button id="picker-close" class="icon-btn compact" type="button" data-label="close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div id="picker-list" class="picker-list"></div>
          </div>

          <div id="permission" class="permission glass-card" hidden>
            <p data-text="permissionText"></p>
            <button class="primary" id="grant" type="button" data-text="grant"></button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite" hidden></p>
        </section>

        <section class="preset-section" aria-labelledby="preset-title">
          <header class="section-heading">
            <h2 id="preset-title" data-text="presets"></h2>
            <button id="new" class="pill-action" type="button" data-text="new"></button>
          </header>
          <div id="preset-list" class="presets"></div>
          <div id="empty" class="empty glass-card" hidden>
            <p data-text="empty"></p>
            <button id="save-current" class="primary" type="button" data-text="saveCurrent"></button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="preset-form">
      <h2 id="editor-title"></h2>
      <label><span data-text="name"></span><input id="name" required maxlength="60" autocomplete="off"></label>
      <label><span data-text="output"></span><select id="output-select" required></select></label>
      <label><span data-text="input"></span><select id="input-select" required></select></label>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" class="subtle" id="cancel" data-text="cancel"></button>
        <button type="submit" class="primary" id="save" data-text="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="remove-dialog" aria-labelledby="remove-title">
    <form method="dialog">
      <h2 id="remove-title" data-text="removeTitle"></h2>
      <p id="remove-name"></p>
      <div class="actions">
        <button value="cancel" class="subtle" data-text="cancel" autofocus></button>
        <button value="remove" class="danger" data-text="remove"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
