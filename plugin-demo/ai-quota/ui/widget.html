<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Quota Glass HUD</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="hud-shell" class="hud-shell">
    <header class="hud-header" data-lumakey-drag>
      <div class="brand">
        <span class="pulse-dot" id="live-dot"></span>
        <div>
          <div class="brand-title" id="hud-title">AI 额度玻璃挂件</div>
          <div class="brand-sub" id="hud-sub">正在连接本机 CLI…</div>
        </div>
      </div>
      <div class="win-controls" data-lumakey-no-drag>
        <button id="btn-compact" class="icon-btn" title="切换紧凑/展开模式">⤢</button>
        <button id="btn-pin" class="icon-btn active" title="切换置顶状态">📌</button>
        <button id="btn-refresh" class="icon-btn" title="跳过缓存强制刷新">↻</button>
        <button id="btn-close" class="icon-btn danger" title="关闭挂件">✕</button>
      </div>
    </header>

    <section class="rings-strip" id="rings-strip"></section>

    <section class="detail-pane" id="detail-pane">
      <div class="provider-list" id="provider-list"></div>
      <footer class="hud-footer" data-lumakey-no-drag>
        <label class="opacity-wrap" title="调节自由浮窗不透明度">
          <span>透明度</span>
          <input id="opacity-slider" type="range" min="25" max="100" value="96" />
        </label>
        <div class="footer-actions">
          <button id="btn-notify" class="pill-btn">发送通知摘要</button>
          <button id="btn-settings" class="pill-btn ghost">密钥设置</button>
        </div>
      </footer>
    </section>
  </div>
  <script src="widget.js"></script>
</body>
</html>
