<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- 1. Chassis & Keycap Drop Shadows -->
    <filter id="chassisShadow" x="-10%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020512" flood-opacity="0.48"/>
    </filter>
    <filter id="keywellShadow" x="-18%" y="-12%" width="136%" height="142%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#01030c" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.26"/>
    </filter>
    <filter id="dishLipShadow" x="-10%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#030616" flood-opacity="0.58"/>
    </filter>
    <filter id="gemShadow" x="-24%" y="-20%" width="148%" height="152%">
      <feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#020514" flood-opacity="0.80"/>
    </filter>
    <filter id="orbitBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 2. Gradients -->
    <linearGradient id="chassisBase" x1="110" y1="44" x2="412" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14214E"/>
      <stop offset="54%" stop-color="#080D22"/>
      <stop offset="100%" stop-color="#150C32"/>
    </linearGradient>

    <radialGradient id="causticCyan" cx="122" cy="388" r="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.52"/>
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticViolet" cx="398" cy="118" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.50"/>
      <stop offset="46%" stop-color="#F472B6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chassisRim" x1="48" y1="44" x2="464" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="32%" stop-color="#7DD3FC" stop-opacity="0.48"/>
      <stop offset="68%" stop-color="#6366F1" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.54"/>
    </linearGradient>

    <linearGradient id="skirtHoriz" x1="114" y1="262" x2="398" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="20%" stop-color="#2D6CE4"/>
      <stop offset="50%" stop-color="#1C245E"/>
      <stop offset="80%" stop-color="#6028BA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="skirtVert" x1="256" y1="122" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0E1436" stop-opacity="0.28"/>
      <stop offset="84%" stop-color="#0A0E28" stop-opacity="0.54"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="skirtRim" x1="114" y1="122" x2="398" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.70"/>
      <stop offset="52%" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.56"/>
    </linearGradient>

    <linearGradient id="dishBase" x1="133" y1="132" x2="379" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#284292"/>
      <stop offset="52%" stop-color="#101942"/>
      <stop offset="100%" stop-color="#281860"/>
    </linearGradient>

    <radialGradient id="dishWell" cx="256" cy="238" r="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050818" stop-opacity="0.60"/>
      <stop offset="64%" stop-color="#111C4A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.30"/>
    </radialGradient>

    <radialGradient id="dishGlow" cx="256" cy="247" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.36"/>
      <stop offset="52%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dishGloss" x1="256" y1="132" x2="256" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dishRim" x1="133" y1="132" x2="379" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#7DD3FC" stop-opacity="0.65"/>
      <stop offset="72%" stop-color="#818CF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.62"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="-124" y1="18" x2="124" y2="-18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#F0F9FF"/>
      <stop offset="74%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="gemNW" x1="256" y1="245" x2="164" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="gemNE" x1="256" y1="245" x2="348" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gemSE" x1="256" y1="245" x2="348" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="gemSW" x1="256" y1="245" x2="164" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <radialGradient id="gemApex" cx="252" cy="240" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="36%" stop-color="#E0F2FE" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pearlGlow" cx="342" cy="176" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="42%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Clips -->
    <clipPath id="chassisClip">
      <rect x="47" y="42" width="418" height="418" rx="94.5"/>
    </clipPath>
    <clipPath id="skirtClip">
      <rect x="114" y="118" width="284" height="280" rx="74"/>
    </clipPath>
    <clipPath id="dishClip">
      <rect x="133.5" y="128" width="245" height="230" rx="56"/>
    </clipPath>
    <clipPath id="gemClip">
      <path d="M256 147 Q276 225 348 245 Q276 265 256 339 Q236 265 164 245 Q236 225 256 147 Z"/>
    </clipPath>
    <clipPath id="orbitBackClip">
      <polygon points="82,358 434,140 310,-40 -40,180"/>
    </clipPath>
    <clipPath id="orbitFrontClip">
      <polygon points="80,354 432,136 552,312 200,530"/>
    </clipPath>
  </defs>

  <!-- Chassis Drop Shadow -->
  <g filter="url(#chassisShadow)">
    <rect x="47" y="42" width="418" height="418" rx="94.5" fill="#070A1C"/>
  </g>

  <!-- Inside 3D Obsidian-Sapphire Chassis -->
  <g clip-path="url(#chassisClip)">
    <rect x="47" y="42" width="418" height="418" fill="url(#chassisBase)"/>
    <circle cx="122" cy="388" r="268" fill="url(#causticCyan)"/>
    <circle cx="398" cy="118" r="256" fill="url(#causticViolet)"/>

    <!-- Soft Inner Bevel Cushion -->
    <rect x="50" y="45" width="412" height="412" rx="91.5" stroke="url(#chassisRim)" stroke-width="5.5" opacity="0.45"/>

    <!-- 3D Extruded Tactile Keycap Skirt + Deep Keywell Shadow -->
    <g filter="url(#keywellShadow)">
      <rect x="114" y="118" width="284" height="280" rx="74" fill="#0C122E"/>
    </g>
    <g clip-path="url(#skirtClip)">
      <rect x="114" y="118" width="284" height="280" fill="url(#skirtHoriz)"/>
      <rect x="114" y="118" width="284" height="280" fill="url(#skirtVert)"/>
      <g filter="url(#dishLipShadow)">
        <rect x="133.5" y="128" width="245" height="230" rx="56" fill="#141E4C"/>
      </g>
    </g>
    <rect x="114" y="118" width="284" height="280" rx="74" stroke="url(#skirtRim)" stroke-width="2.6"/>

    <!-- 3D Concave Frosted Sapphire Key-Top Dish -->
    <g clip-path="url(#dishClip)">
      <rect x="133.5" y="128" width="245" height="230" fill="url(#dishBase)"/>
      <rect x="133.5" y="128" width="245" height="230" fill="url(#dishWell)"/>
      <rect x="133.5" y="128" width="245" height="230" fill="url(#dishGlow)"/>
      <ellipse cx="256" cy="150" rx="152" ry="74" fill="url(#dishGloss)"/>
    </g>
    <rect x="133.5" y="128" width="245" height="230" rx="56" stroke="url(#dishRim)" stroke-width="4.2"/>

    <!-- 3D Orbital Prism Ring: BACK HALF (Behind Gem) -->
    <g clip-path="url(#orbitBackClip)" filter="url(#orbitBloom)">
      <g transform="translate(256 245) rotate(-31.5)">
        <path fill-rule="evenodd" fill="url(#orbitGrad)"
              d="M 124,0 A 124,52 0 1,0 -124,0 A 124,52 0 1,0 124,0 Z
                 M 110,-6 A 110,41 0 1,1 -110,-6 A 110,41 0 1,1 110,-6 Z"/>
      </g>
    </g>

    <!-- 3D Sculpted Cushion-Faceted Crystal Gem -->
    <g filter="url(#gemShadow)">
      <path d="M256 147 Q276 225 348 245 Q276 265 256 339 Q236 265 164 245 Q236 225 256 147 Z" fill="#FFFFFF"/>
    </g>
    <g clip-path="url(#gemClip)">
      <polygon points="256,245 256,142 158,142 158,245" fill="url(#gemNW)"/>
      <polygon points="256,245 256,142 354,142 354,245" fill="url(#gemNE)"/>
      <polygon points="256,245 354,245 354,344 256,344" fill="url(#gemSE)"/>
      <polygon points="256,245 158,245 158,344 256,344" fill="url(#gemSW)"/>
      <circle cx="252" cy="240" r="48" fill="url(#gemApex)"/>
      <line x1="256" y1="147" x2="256" y2="339" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
      <line x1="164" y1="245" x2="348" y2="245" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
    </g>
    <path d="M256 147 Q276 225 348 245 Q276 265 256 339 Q236 265 164 245 Q236 225 256 147 Z"
          stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.86"/>

    <!-- 3D Orbital Prism Ring: FRONT HALF (Sweeping In Front of Gem!) -->
    <g clip-path="url(#orbitFrontClip)" filter="url(#orbitBloom)">
      <g transform="translate(256 245) rotate(-31.5)">
        <path fill-rule="evenodd" fill="url(#orbitGrad)"
              d="M 124,0 A 124,52 0 1,0 -124,0 A 124,52 0 1,0 124,0 Z
                 M 110,-6 A 110,41 0 1,1 -110,-6 A 110,41 0 1,1 110,-6 Z"/>
      </g>
    </g>

    <!-- Luminous Photon Pearl on Orbit Crest -->
    <circle cx="342" cy="176" r="22" fill="url(#pearlGlow)"/>
  </g>

  <!-- Crisp Studio Outer Hairline Rim -->
  <rect x="47" y="42" width="418" height="418" rx="94.5" stroke="url(#chassisRim)" stroke-width="3.2"/>
</svg>
